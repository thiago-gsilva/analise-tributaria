<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Análise Tributária</title>
<meta name="description" content="Planejamento tributário: compare Simples Nacional, Simples Híbrido e Lucro Presumido para empresas existentes, novas ou simulações avulsas, com Fator R, IBS/CBS e relatório em PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   IDENTIDADE VISUAL
   Paleta-base:  #EDEDED fundo claro · #03131C texto · #0C171B estrutura ·
                 #455157 secundário / fundo escuro · #040809 contraste ·
                 #FF5001 SOMENTE atenção, divergência e ações sensíveis.
   Tipografia:   Alata (títulos, navegação, botões, rótulos) · Inter (texto
                 corrido e tabelas) · números financeiros com tabular-nums.
   ========================================================================== */
:root{
  color-scheme: light;
  --c-bg:        #EDEDED;
  --c-text:      #03131C;
  --c-struct:    #0C171B;
  --c-second:    #455157;
  --c-contrast:  #040809;
  --c-attn:      #FF5001;

  --bg:          #EDEDED;
  --surface:     #F4F4F3;      /* cartões: um tom acima do fundo, sem branco puro */
  --surface-2:   #E3E4E4;      /* áreas rebaixadas (cabeçalho de tabela, zebra, campos) */
  --surface-3:   #D6D9DA;
  --border:      #C9CDCE;
  --border-strong:#A9B0B3;
  --text:        #03131C;
  --text-sec:    #455157;
  --text-mute:   #66737A;
  --heading:     #03131C;
  --nav-bg:      #0C171B;
  --nav-text:    #EDEDED;
  --nav-mute:    #93A0A6;
  --nav-line:    #1F2D33;
  --nav-active:  #17262C;
  --contrast-bg: #040809;      /* regiões de contraste (blocos de fórmula, destaque) */
  --contrast-tx: #EDEDED;
  --accent:      #0C171B;      /* ação primária */
  --accent-tx:   #EDEDED;
  --attn:        #FF5001;
  --attn-bg:     rgba(255,80,1,.10);
  --attn-tx:     #03131C;
  --ok:          #3C7A5B;   --ok-bg: rgba(60,122,91,.13);
  --prog:        #4B6F8A;   --prog-bg: rgba(75,111,138,.14);
  --err:         #A6403F;   --err-bg: rgba(166,64,63,.12);
  --info:        #455157;   --info-bg: rgba(69,81,87,.12);
  --focus:       #0C171B;
  --shadow:      0 1px 2px rgba(3,19,28,.07);
  --shadow-pop:  0 10px 28px rgba(3,19,28,.18);
  --r:           6px;
  --r-lg:        8px;
  --ff-display: 'Alata','Segoe UI',system-ui,sans-serif;
  --ff-body:    'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sb-w: 252px;
  /* paleta categórica discreta (gráficos) */
  --s1:#0C171B; --s2:#455157; --s3:#7C8B92; --s4:#B5BEC1; --s5:#3F6F73; --s6:#8C7A56; --s7:#5E6E8C; --s8:#8A5E57;
  --chart-grid: rgba(3,19,28,.10);
  --chart-text: #455157;
  --chart-bg:   transparent;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:          #455157;
  --surface:     #3B464B;
  --surface-2:   #323C41;
  --surface-3:   #2A3438;
  --border:      #56646B;
  --border-strong:#6C7B83;
  --text:        #EDEDED;
  --text-sec:    #CBD1D3;
  --text-mute:   #A9B3B7;
  --heading:     #EDEDED;
  --nav-bg:      #0C171B;
  --nav-active:  #1A2A31;
  --accent:      #EDEDED;
  --accent-tx:   #03131C;
  --attn-bg:     rgba(255,80,1,.16);
  --attn-tx:     #EDEDED;
  --ok:          #86C2A2;   --ok-bg: rgba(134,194,162,.16);
  --prog:        #9FBDD4;   --prog-bg: rgba(159,189,212,.16);
  --err:         #E19A98;   --err-bg: rgba(225,154,152,.16);
  --info:        #CBD1D3;   --info-bg: rgba(237,237,237,.09);
  --focus:       #EDEDED;
  --shadow:      0 1px 2px rgba(0,0,0,.28);
  --shadow-pop:  0 12px 30px rgba(0,0,0,.5);
  --s1:#EDEDED; --s2:#B5C0C5; --s3:#8FA0A8; --s4:#6E7F88; --s5:#7FB3B7; --s6:#C9B27F; --s7:#9FB2D6; --s8:#D49C94;
  --chart-grid: rgba(237,237,237,.14);
  --chart-text: #CBD1D3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    color-scheme: dark;
    --bg:#455157; --surface:#3B464B; --surface-2:#323C41; --surface-3:#2A3438; --border:#56646B; --border-strong:#6C7B83;
    --text:#EDEDED; --text-sec:#CBD1D3; --text-mute:#A9B3B7; --heading:#EDEDED; --nav-active:#1A2A31;
    --accent:#EDEDED; --accent-tx:#03131C; --attn-bg:rgba(255,80,1,.16); --attn-tx:#EDEDED;
    --ok:#86C2A2; --ok-bg:rgba(134,194,162,.16); --prog:#9FBDD4; --prog-bg:rgba(159,189,212,.16);
    --err:#E19A98; --err-bg:rgba(225,154,152,.16); --info:#CBD1D3; --info-bg:rgba(237,237,237,.09); --focus:#EDEDED;
    --shadow:0 1px 2px rgba(0,0,0,.28); --shadow-pop:0 12px 30px rgba(0,0,0,.5);
    --s1:#EDEDED; --s2:#B5C0C5; --s3:#8FA0A8; --s4:#6E7F88; --s5:#7FB3B7; --s6:#C9B27F; --s7:#9FB2D6; --s8:#D49C94;
    --chart-grid:rgba(237,237,237,.14); --chart-text:#CBD1D3;
  }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:auto}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ff-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background-color .2s ease,color .2s ease;
}
h1,h2,h3,h4{font-family:var(--ff-display);font-weight:400;color:var(--heading);margin:0;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--text);text-underline-offset:2px}
::selection{background:var(--c-second);color:#EDEDED}
.num,.tnum,td.num,th.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
svg{flex:0 0 auto}

/* ==========================================================================
   LAYOUT
   ========================================================================== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--nav-bg);color:var(--nav-text);
  position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;padding:22px 16px 18px;z-index:20;
}
.brand{padding:0 8px 20px;border-bottom:1px solid var(--nav-line);margin-bottom:18px}
.brand strong{display:block;font-family:var(--ff-display);font-weight:400;font-size:18px;letter-spacing:.01em;color:#EDEDED}
.brand span{display:block;font-size:11.5px;color:var(--nav-mute);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav-label{font-family:var(--ff-display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--nav-mute);padding:0 10px 8px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 10px;border:0;border-radius:var(--r);background:transparent;color:var(--nav-text);
  font-family:var(--ff-display);font-size:14px;cursor:pointer;position:relative;
  transition:background .15s ease;
}
.nav-item:hover{background:var(--nav-active)}
.nav-item .n{
  width:24px;height:24px;border-radius:50%;border:1px solid #4A5A61;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--nav-mute);flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.nav-item .t{display:flex;flex-direction:column;line-height:1.2}
.nav-item .t small{font-family:var(--ff-body);font-size:11px;color:var(--nav-mute);margin-top:2px}
.nav-item[aria-current="page"]{background:var(--nav-active)}
.nav-item[aria-current="page"] .n{background:#EDEDED;color:#0C171B;border-color:#EDEDED}
.nav-item.done .n{border-color:#86C2A2;color:#86C2A2}
.nav-item[disabled]{opacity:.45;cursor:not-allowed}
.nav-sep{height:1px;background:var(--nav-line);margin:16px 8px}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:transparent;border-radius:var(--r);color:var(--nav-text);font-family:var(--ff-display);font-size:13px;cursor:pointer;width:100%;text-align:left}
.nav-link svg{width:16px;height:16px;stroke:var(--nav-mute)}
.nav-link:hover{background:var(--nav-active)}
.nav-link .cnt{margin-left:auto;font-size:11px;color:var(--nav-mute);font-family:var(--ff-body)}
.sidebar-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--nav-line);font-size:11px;color:var(--nav-mute);line-height:1.45}
.sidebar-foot strong{color:#EDEDED;font-weight:500}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 32px;border-bottom:1px solid var(--border);background:var(--bg);
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.crumb{font-family:var(--ff-display);font-size:13px;color:var(--text-sec);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb b{font-weight:400;color:var(--heading)}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:100px;
  padding:3px 10px;font-size:12px;color:var(--text-sec);background:transparent;white-space:nowrap;
}
.topbar-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta-text{font-size:12px;color:var(--text-mute)}
.meta-text strong{font-weight:600;color:var(--text-sec)}
.menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--border-strong);border-radius:var(--r);background:transparent;cursor:pointer;align-items:center;justify-content:center}
.menu-toggle svg{width:18px;height:18px;stroke:var(--text)}
.theme-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden}
.theme-btn{display:flex;align-items:center;justify-content:center;width:32px;height:30px;border:0;background:transparent;color:var(--text-sec);cursor:pointer}
.theme-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn:hover{background:var(--surface-2)}
.theme-btn.active{background:var(--accent);color:var(--accent-tx)}

.content{padding:28px 32px 72px;width:100%;max-width:1240px;margin:0 auto}
.section{display:flex;flex-direction:column;gap:22px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-head h2{font-size:26px;line-height:1.15}
.section-head .sub{font-size:13.5px;color:var(--text-sec);margin-top:6px;max-width:68ch}
.section-actions{display:flex;gap:8px;flex-wrap:wrap}
.step-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px;margin-top:6px}

/* ==========================================================================
   SUPERFÍCIES — cartão só quando há um agrupamento real de conteúdo
   ========================================================================== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow);transition:background-color .2s ease,border-color .2s ease}
.panel.flat{box-shadow:none;background:transparent}
.panel-title,.group-title{font-family:var(--ff-display);font-size:15px;color:var(--heading);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel-title .grow,.group-title .grow{flex:1}
.panel-title svg,.group-title svg{width:16px;height:16px;stroke:var(--text-sec)}
.group{border-top:1px solid var(--border);padding-top:18px;margin-top:20px}
.group:first-child{border-top:0;padding-top:0;margin-top:0}
.group-title{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-sec);margin-bottom:12px}
.group-desc{font-size:12.5px;color:var(--text-sec);margin:-6px 0 14px;max-width:70ch}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-fill{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.split>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.divider{height:1px;background:var(--border);margin:6px 0}
.muted{color:var(--text-sec)}
.mute2{color:var(--text-mute)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.strong{font-weight:600}
.display{font-family:var(--ff-display)}

/* ---- Escolha do tipo de análise ---- */
.choice-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.row-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pdf-status{margin-top:12px}
.pdf-status:empty{display:none}
.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.choice-grid,.choice-grid.two{grid-template-columns:1fr}}
.choice{
  text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease,background-color .15s ease;
}
.choice:hover{border-color:var(--border-strong);background:var(--surface-2)}
.choice[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.choice .k{font-family:var(--ff-display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}
.choice h3{font-size:18px}
.choice .d1{font-size:13.5px;color:var(--text)}
.choice .d2{font-size:12.5px;color:var(--text-sec)}

/* ==========================================================================
   FORMULÁRIOS
   ========================================================================== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-family:var(--ff-display);font-size:13px;color:var(--heading)}
.field .hint{font-size:12px;color:var(--text-sec)}
.field input[type="text"],.field input[type="number"],.field input[type="month"],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;
  color:var(--text);transition:border-color .15s ease,box-shadow .15s ease;
}
.field input::placeholder{color:var(--text-mute)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text);outline:none;box-shadow:0 0 0 2px var(--border-strong)}
.field input[readonly]{background:transparent;color:var(--text-sec)}
.field .unit{position:relative}
.field .unit input{padding-left:36px}
.field .unit::before{content:attr(data-unit);position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-mute);pointer-events:none}
.field .unit.suf input{padding-left:11px;padding-right:32px}
.field .unit.suf::before{left:auto;right:11px}
.field.invalid input,.field.invalid select{border-color:var(--attn)}
.checkbox-row{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text);cursor:pointer}
.checkbox-row input{width:16px;height:16px;margin-top:2px;accent-color:var(--c-second)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{
  border:0;background:transparent;padding:8px 14px;font-family:var(--ff-display);font-size:13px;cursor:pointer;color:var(--text-sec);
  border-right:1px solid var(--border);transition:background-color .15s ease;
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-tx)}
.autocomplete{position:relative}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);box-shadow:var(--shadow-pop);max-height:290px;overflow-y:auto;z-index:30}
.ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.hi{background:var(--surface-2)}
.ac-item .code{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.ac-item .tag{float:right;font-size:11px;color:var(--text-mute)}
.ac-item .desc{color:var(--text-sec);margin-top:1px}
.ac-item.ac-empty{cursor:default;color:var(--text-sec);font-style:italic}
.cnae-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Seções retráteis (ajustes avançados, detalhamento técnico) */
details.collapse{border:1px solid var(--border);border-radius:var(--r-lg);background:transparent}
details.collapse+details.collapse{margin-top:10px}
details.collapse>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;
  font-family:var(--ff-display);font-size:14px;color:var(--heading);user-select:none;border-radius:var(--r-lg);
}
details.collapse>summary::-webkit-details-marker{display:none}
details.collapse>summary .chev{width:15px;height:15px;stroke:var(--text-sec);margin-left:auto;transition:transform .2s ease}
details.collapse[open]>summary .chev{transform:rotate(180deg)}
details.collapse>summary:hover{background:var(--surface-2)}
details.collapse>summary .sum-hint{font-family:var(--ff-body);font-size:12px;color:var(--text-mute)}
details.collapse>.collapse-body{padding:6px 18px 20px;border-top:1px solid var(--border);padding-top:18px}

/* ==========================================================================
   BOTÕES, ETIQUETAS, AVISOS
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:9px 16px;
  font-family:var(--ff-display);font-size:14px;line-height:1.1;cursor:pointer;border:1px solid transparent;
  transition:background-color .15s ease,border-color .15s ease,opacity .15s ease;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-tx)}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:transparent;border-color:var(--border-strong);color:var(--heading)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-sec)}
.btn-ghost:hover{background:var(--surface-2);color:var(--heading)}
.btn-attn{background:transparent;border-color:var(--attn);color:var(--heading)}
.btn-attn:hover{background:var(--attn-bg)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--ff-display);font-size:11.5px;letter-spacing:.02em;padding:2px 9px;border-radius:100px;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.badge svg{width:11px;height:11px}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-prog,.badge-blue{background:var(--prog-bg);color:var(--prog)}
.badge-err,.badge-red{background:var(--err-bg);color:var(--err)}
.badge-info,.badge-neutral{background:var(--info-bg);color:var(--info)}
.badge-attn,.badge-yellow{background:var(--attn);color:#040809}
.badge-green{background:var(--ok-bg);color:var(--ok)}
.badge-outline{border-color:var(--border-strong);color:var(--text-sec)}

.note{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);font-size:13px;color:var(--text)}
.note svg{width:16px;height:16px;margin-top:2px;stroke:var(--text-sec)}
.note.attn{border-color:var(--attn);background:var(--attn-bg)}
.note.attn svg{stroke:var(--attn)}
.note.ok svg{stroke:var(--ok)}
.note.err svg{stroke:var(--err)}
.note b{font-weight:600}

/* ==========================================================================
   NÚMEROS, TABELAS, LISTAS
   ========================================================================== */
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .l{font-family:var(--ff-display);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-mute)}
.stat .v{font-family:var(--ff-body);font-weight:600;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--heading);line-height:1.2}
.stat .s{font-size:12px;color:var(--text-sec)}
.stat.sm .v{font-size:17px}
.stat.lg .v{font-size:30px}
.kv{display:flex;flex-direction:column}
.kv .r{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--border);font-size:13px}
.kv .r:first-child{border-top:0}
.kv .r span:first-child{color:var(--text-sec)}
.kv .r span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{background:var(--surface-2);color:var(--heading);text-align:left;font-family:var(--ff-display);font-weight:400;font-size:12px;letter-spacing:.03em;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--border-strong)}
thead th.num,tbody td.num,tfoot td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:9px 14px;border-top:1px solid var(--border);color:var(--text)}
tbody tr:first-child td{border-top:0}
tbody tr.hl td{background:var(--surface-2)}
tbody tr.total td,tfoot td{font-weight:600;border-top:1px solid var(--border-strong);background:var(--surface-2)}
tbody tr.best td:first-child{box-shadow:inset 3px 0 0 var(--text)}
tbody tr.off td{color:var(--text-mute)}
tbody tr:hover td{background:var(--surface-2)}
table.monthly{min-width:760px}
table.monthly td,table.monthly th{padding:7px 10px}
.scroll-y{max-height:360px;overflow:auto}

/* ---- Resultados: placar principal ---- */
.hero{
  background:var(--contrast-bg);color:var(--contrast-tx);border-radius:var(--r-lg);padding:24px 26px;
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center;
}
.hero h2,.hero h3{color:#EDEDED}
.hero .eyebrow{font-family:var(--ff-display);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#93A0A6}
.hero .big{font-weight:600;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 4px}
.hero .sub{font-size:13px;color:#B5BEC1}
.hero .kv .r{border-color:#1F2D33;color:#EDEDED}
.hero .kv .r span:first-child{color:#93A0A6}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.regime-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.regime-grid{grid-template-columns:1fr}}
.regime{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:10px;
}
.regime.best{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.regime.off{opacity:.8}
.regime .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.regime h3{font-size:16px}
.regime .val{font-weight:600;font-size:26px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.regime .row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-sec);padding-top:8px;border-top:1px solid var(--border)}
.regime .row2 b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:300px;width:100%}
.chart-box.sm{height:230px}
.chart-box.tall{height:360px}
.chart-box canvas{max-width:100%}
.chart-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-size:13px;text-align:center;padding:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-btn{padding:9px 14px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--ff-display);font-size:14px;color:var(--text-sec);cursor:pointer}
.tab-btn:hover{color:var(--heading)}
.tab-btn[aria-selected="true"]{color:var(--heading);border-color:var(--heading)}

/* ---- Pendências ---- */
.pend{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.pend-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.pend-head h3{font-size:15px}
.pend-head .badge{white-space:normal;text-align:left}
.pend-group{padding:12px 16px 4px}
.panel+.pend,.pend+.pend{margin-top:16px}
.pend-group h4{font-family:var(--ff-display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pend-item{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.pend-item:first-of-type{border-top:0}
.pend-dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--text-mute);flex:0 0 auto}
.pend-item.pendente .pend-dot{background:var(--prog)}
.pend-item.atencao .pend-dot{background:var(--attn)}
.pend-item.estimativa .pend-dot{background:transparent;border:1.5px solid var(--text-sec)}
.pend-item.confirmado .pend-dot{background:var(--ok)}
.pend-item.opcional .pend-dot{background:transparent;border:1.5px dashed var(--text-mute)}
.pend-item .pt{font-weight:600;color:var(--heading)}
.pend-item .px{color:var(--text-sec);margin-top:2px}
.pend-item .pq{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.pend-item select{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;max-width:100%}
.pend-item .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pend-foot{padding:6px 16px 14px}

/* ---- Fator R ---- */
.meter{height:8px;background:var(--surface-3);border-radius:100px;position:relative;overflow:visible}
.meter>i{display:block;height:100%;border-radius:100px;background:var(--text-sec)}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
.scn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.scn{grid-template-columns:1fr}}
.scn .c{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.scn .c.win{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}

/* ---- Memória de cálculo ---- */
.mem{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.mem+.mem{margin-top:8px}
.mem>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;font-family:var(--ff-display);font-size:14px}
.mem>summary::-webkit-details-marker{display:none}
.mem>summary .sn{width:24px;height:24px;border-radius:5px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.mem>summary .chev{margin-left:auto;width:15px;height:15px;stroke:var(--text-sec);transition:transform .2s ease}
.mem[open]>summary .chev{transform:rotate(180deg)}
.mem-body{padding:4px 16px 16px 50px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--text-sec)}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--contrast-bg);color:var(--contrast-tx);padding:10px 12px;border-radius:var(--r);overflow-x:auto;line-height:1.55}

/* ---- Fontes ---- */
.source-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.source-row:first-child{border-top:0}
.source-row .name{font-weight:600;font-size:13px;color:var(--heading)}
.source-row .desc{font-size:12.5px;color:var(--text-sec);margin-top:2px;max-width:640px}
.source-row .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.source-row .date{font-size:11.5px;color:var(--text-mute)}

/* ---- Relatório ---- */
.pptx-stage{background:var(--contrast-bg);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.report-opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.report-opt{grid-template-columns:1fr}}

/* ---- Biblioteca / modal ---- */
.scrim-modal{position:fixed;inset:0;background:rgba(4,8,9,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-lg);max-width:880px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-pop)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h3{font-size:18px}
.modal-body{padding:18px 20px 22px}
.lib-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.lib-item:first-child{border-top:0}
.lib-item .nm{font-weight:600;color:var(--heading)}
.lib-item .ds{font-size:12.5px;color:var(--text-sec)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--contrast-bg);color:#EDEDED;padding:10px 16px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow-pop);z-index:90}

/* ---- Meses variáveis ---- */
.months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.months-grid .field>label{font-size:12px;color:var(--text-sec)}

.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--text);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:9px;color:var(--text-sec);font-size:13px}
.fade-in{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ==========================================================================
   RESPONSIVO
   ========================================================================== */
.sidebar-scrim{display:none}
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-pop);width:80vw;max-width:300px}
  .sidebar.open{transform:none}
  .sidebar-scrim.open{display:block;position:fixed;inset:0;background:rgba(4,8,9,.5);z-index:19}
  .menu-toggle{display:flex}
  .topbar{padding:12px 16px}
  .content{padding:20px 16px 56px}
  .section-head h2{font-size:22px}
}
@media (max-width:1366px) and (min-width:981px){
  :root{--sb-w:228px}
  .content{padding:24px 24px 64px}
  .hero .big{font-size:30px}
}

/* ==========================================================================
   V3.2 — REFINAMENTO VISUAL E FLUIDEZ (somente UI; mesma paleta e fontes)
   Um único sistema para as quatro etapas: campos 40 px, botões 40/32 px,
   títulos (h2 → group-title → label), retráteis em lista com divisor
   discreto, tabelas e gráficos com a mesma moldura. Tudo escopado em
   #stepRoot para não afetar o PDF (que reutiliza algumas classes globais).
   ========================================================================== */
:root{--field-h:40px;--btn-h:40px;--btn-h-sm:32px;--gap-s:8px;--gap-m:16px;--gap-l:24px}
#stepRoot{gap:var(--gap-l)}
#stepRoot .section-head h2{font-size:24px}
#stepRoot .section-head .sub{font-size:13px;margin-top:4px;max-width:62ch}
/* campos e botões — alturas padronizadas */
#stepRoot .field input[type="text"],#stepRoot .field select{height:var(--field-h);padding:0 12px}
#stepRoot .field .unit input{padding-left:38px}
#stepRoot .field .unit.suf input{padding-left:12px;padding-right:34px}
#stepRoot .btn,.modal .btn{min-height:var(--btn-h)}
#stepRoot .btn-sm,.modal .btn-sm{min-height:var(--btn-h-sm);padding:0 12px}
#stepRoot .seg button{height:calc(var(--field-h) - 2px);padding:0 14px}
#stepRoot .seg.sm button{height:30px;padding:0 11px;font-size:12.5px}
.field .hint,.field .field-err{font-size:12px;line-height:1.4}
.field .field-err{color:var(--err);display:flex;gap:6px;align-items:flex-start}
.field .field-err.warn{color:var(--text)}
.field .field-err::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--err);margin-top:6px;flex:0 0 auto}
.field .field-err.warn::before{background:var(--attn)}
.field.invalid input,.field.invalid select{border-color:var(--err)}
.field .lbl-row{display:flex;align-items:center;gap:6px}
.field .opt{font-family:var(--ff-body);font-size:12px;color:var(--text-mute)}
/* ajuda contextual discreta */
.help{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);font-family:var(--ff-body);font-size:10.5px;color:var(--text-mute);cursor:help;flex:0 0 auto;user-select:none}
.help:hover,.help:focus{color:var(--heading);border-color:var(--text);outline:none}
.help::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(280px,70vw);background:var(--contrast-bg);color:var(--contrast-tx);font-family:var(--ff-body);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:var(--r);box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;z-index:40;transition:opacity .12s ease;text-align:left;white-space:normal}
.help:hover::after,.help:focus::after{opacity:1}
/* formulário plano: grupos separados por divisor, sem moldura */
#stepRoot .panel.plain{background:transparent;border:0;box-shadow:none;padding:0}
#stepRoot .group{border-top:1px solid var(--border);padding-top:20px;margin-top:20px}
#stepRoot .field>.seg{align-self:flex-start;max-width:100%}
#stepRoot .group:first-child{border-top:0;padding-top:0;margin-top:0}
#stepRoot .group-title{font-size:12px;letter-spacing:.07em;margin-bottom:var(--gap-m)}
#stepRoot .group-title .gt-n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);font-size:11px;letter-spacing:0;color:var(--text-sec)}
#stepRoot .group-desc{margin:-6px 0 var(--gap-m)}
.form-stack{display:flex;flex-direction:column;gap:var(--gap-m)}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--gap-m);align-items:start}
.field-row.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.field-row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:720px){.field-row.r2,.field-row.r3{grid-template-columns:minmax(0,1fr)}}
.inline-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-sec)}
.inline-line b{color:var(--text);font-weight:600}
.link-btn{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit;font-size:12.5px}
.link-btn:hover{color:var(--heading)}
.subtle-line{border-top:1px solid var(--border);padding-top:12px;font-size:12.5px;color:var(--text-sec)}
/* retráteis: lista com divisor, sem caixas */
#stepRoot details.collapse{border:0;border-top:1px solid var(--border);border-radius:0;background:transparent}
#stepRoot details.collapse+details.collapse{margin-top:0}
#stepRoot details.collapse:last-of-type{border-bottom:1px solid var(--border)}
#stepRoot details.collapse>summary{padding:12px 2px;border-radius:0;font-size:14px;gap:10px;min-height:44px}
#stepRoot details.collapse>summary:hover{background:transparent}
#stepRoot details.collapse>summary:hover .chev{stroke:var(--heading)}
#stepRoot details.collapse>.collapse-body{border-top:0;padding:4px 2px 22px}
#stepRoot details.collapse details.collapse>summary{font-size:13.5px}
#stepRoot .collapse-list{display:flex;flex-direction:column}
#stepRoot .collapse-list>.list-title{font-family:var(--ff-display);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-sec);margin:0 0 6px}
/* escolha de tipo / modelo: uma ação, descrição curta */
#stepRoot .choice{padding:18px 20px;gap:6px}
#stepRoot .choice h3{font-size:17px}
#stepRoot .choice .go{margin-top:auto;padding-top:8px;font-family:var(--ff-display);font-size:13px;color:var(--text-sec);display:inline-flex;align-items:center;gap:6px}
#stepRoot .choice:hover .go,#stepRoot .choice[aria-pressed="true"] .go{color:var(--heading)}
#stepRoot .choice .go svg{width:14px;height:14px}
#stepRoot .choice[aria-pressed="true"]{box-shadow:none;border-color:var(--text);border-width:2px;padding:17px 19px}
.resume-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:var(--gap-m);font-size:13px;color:var(--text-sec)}
/* resultado: uma leitura em camadas */
#stepRoot .hero{padding:20px 24px;gap:24px}
#stepRoot .hero .big{font-size:32px;margin:4px 0 2px}
.hero .kv .r{padding:7px 0}
#stepRoot .regime{padding:16px 18px;gap:8px}
#stepRoot .regime.best{box-shadow:none;border-width:2px;padding:15px 17px}
#stepRoot .regime .val{font-size:24px}
#stepRoot .regime .conf{font-size:12px;color:var(--text-mute)}
#stepRoot .regime .row2{padding-top:7px}
.alerts{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--border-strong);padding:2px 0 2px 14px}
.alerts.attn{border-left-color:var(--attn)}
.alerts .al{font-size:13px;color:var(--text);display:flex;gap:8px;align-items:flex-start}
.alerts .al::before{content:"•";color:var(--text-mute)}
.alerts .al a,.alerts .al .link-btn{font-size:13px}
.alerts .al-title{font-family:var(--ff-display);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-sec)}
#stepRoot .chart-panel{padding:0}
#stepRoot .chart-panel .panel-title{margin-bottom:8px;font-size:14px}
#stepRoot .chart-box{height:300px}
#stepRoot .chart-box.sm{height:260px}
#stepRoot .table-wrap{border-radius:var(--r)}
#stepRoot thead th{padding:9px 12px}
#stepRoot tbody td{padding:9px 12px}
/* pendências compactas (um único local) */
.pend.mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.pend.mini .pend-head{padding:12px 16px}
.pend.mini .pend-group{padding:10px 16px 2px}
.pend.mini .pend-item{padding:9px 0}
.pend.mini .pend-item .px{font-size:12.5px}
.pend.mini details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 16px;font-family:var(--ff-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-sec);border-top:1px solid var(--border)}
.pend.mini details>summary::-webkit-details-marker{display:none}
.pend.mini details>summary .chev{width:14px;height:14px;margin-left:auto;stroke:var(--text-sec);transition:transform .2s ease}
.pend.mini details[open]>summary .chev{transform:rotate(180deg)}
.pend.mini details>.pend-in{padding:0 16px 8px}
.aside-sticky{position:sticky;top:16px}
.only-narrow{display:none!important}
@media (max-width:1100px){.only-narrow{display:inline-flex!important}.only-wide{display:none!important}}
@media (max-width:1100px){.aside-sticky{position:static}}
.fr-line{display:flex;flex-direction:column;gap:8px}
.fr-line .row{justify-content:space-between}
@media (max-width:720px){
  #stepRoot details.collapse>summary{flex-wrap:wrap;row-gap:2px}
  #stepRoot details.collapse>summary .chev{order:2}
  #stepRoot details.collapse>summary .sum-hint{order:3;flex-basis:100%}
}
.cnae-full{display:none;font-size:12px;color:var(--text-sec)}
@media (max-width:720px){.cnae-full{display:block}}
/* relatório: três opções simples */
#stepRoot .choice-grid.rel .choice{padding:16px 18px}
.rel-sum{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--text-sec);align-items:center}
.rel-sum b{color:var(--text);font-weight:600}

/* ================= V3.2.1 — CONSOLIDAÇÃO (selo de estado, RBT12 estimado, vantagem do Fator R) ================= */
#stepRoot .hero .hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#stepRoot .hero .st{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-display);font-size:11.5px;letter-spacing:.04em;padding:2px 10px;border-radius:100px;border:1px solid #455157;color:#EDEDED;white-space:nowrap;line-height:1.6}
#stepRoot .hero .st svg{width:11px;height:11px}
#stepRoot .hero .st .dot{width:7px;height:7px;border-radius:50%;background:#FF5001;display:inline-block}
#stepRoot .hero .st-line{font-size:12.5px;color:#B5BEC1;margin-top:10px;line-height:1.55}

const ISS_TETO_PCT = 0.05;   // Res. CGSN 140, art. 21, III, "a": percentual efetivo máximo do ISS
function periodoTabelaLC214(ano) {
  if (ano == null || ano < 2027) return null;
  if (ano <= 2028) return "2728";
  return ano >= 2033 ? "2033" : String(ano);
}
// Partilha oficial (em % do DAS) do Anexo/faixa/ano; null antes de 2027 (valem os Anexos de 2026, em ANEXOS).
function partilhaOficial(anexoKey, ano, faixaIdx, aliqEfetiva) {
  const per = periodoTabelaLC214(ano), A = ANEXOS_LC214[anexoKey];
  if (!per || !A) return null;
  const row = A.p[per][faixaIdx];
  if (!row) return null;
  const out = {};
  A.cols.forEach((c, i) => { if (per === "2033" && (c === "ICMS" || c === "ISS")) return; out[c] = row[i]; });
  const cap = ISS_TETO_5A_FAIXA[anexoKey];
  if (cap && faixaIdx === 4 && cap.p[per] && aliqEfetiva > cap.limiar + 1e-12) {
    const c = cap.p[per], exc = aliqEfetiva - 0.05;
    Object.keys(out).forEach((k) => { out[k] = 0; });
    Object.keys(c.fixo).forEach((k) => { out[k] = (c.fixo[k] / aliqEfetiva) * 100; });
    Object.keys(c.fator).forEach((k) => { out[k] = ((exc * c.fator[k]) / 100 / aliqEfetiva) * 100; });
  }
  return out;
}

/* ---------------------------------------------------------------------------
   V3.2.5 — RBT12 ACIMA DO LIMITE DA 5ª FAIXA: percentual efetivo de ICMS, ISS e IBS (Res. CGSN 140/2018, art. 21)
   Regra por período (a mesma fórmula, parâmetros de cada época):
   · 2026 — art. 21, III, "b", da Res. CGSN 140 (texto anterior à Res. CGSN 190; conferido em texto consolidado e na Resposta à Consulta SEFAZ-SP 24036/2021):
     com RBT12 acima do limite da 5ª faixa (R$ 3,6 mi), SEM exceder o sublimite, o percentual efetivo de ICMS/ISS = {[(RBT12 × alíq. nominal da 5ª faixa) − PD da 5ª faixa] ÷ RBT12}
     × percentual de distribuição do ICMS/ISS da 5ª faixa;
   · 2027-2028 — art. 21, IV, na redação da Res. CGSN 190/2026: mesma fórmula, agora para ICMS, ISS e IBS (distribuição da 5ª faixa dos Anexos XVIII a XXII da LC 214/2025);
   · 2029 em diante — idem, com a distribuição de cada ano (2029…2032) e, em 2033, só IBS (ICMS/ISS extintos).
   O valor é somado ao DAS apurado pela 6ª faixa (cuja partilha é 100% tributos federais e CBS). Teto: art. 21, III, "a" — o percentual efetivo máximo do ISS é de 5%; a diferença é
   transferida, proporcionalmente, aos tributos federais (e ao IBS, em 2027-2028) da mesma faixa: não altera o total do DAS, só a composição (relevante no Híbrido, que retira CBS e IBS).
   De 2029 a 2032 o teto de 5% alcança ISS + IBS e é repartido pela proporção do ano (tabela ISS_TETO_5A_FAIXA, Anexos III e IV). As proporções de redistribuição são as da própria 5ª faixa
   (partilha sem o ISS, normalizada) — para os Anexos III e IV coincidem com os fatores publicados nas notas dos Anexos; para o Anexo V são HIPÓTESE (a nota do Anexo V não foi lida).
   Esta função é pura e não decide se o valor se aplica: a aplicação depende de não haver impedimento (avaliarSublimite). */
function calcAcrescimoArt21IV(rbt12, anexoKey, ano) {
  const A = ANEXOS[anexoKey];
  if (!A || !(rbt12 > 0)) return null;
  const f5 = A.faixas[4], n5 = f5.aliq, pd5 = f5.ded;
  const per = periodoTabelaLC214(ano);
  const row5 = {};
  if (per) { const T = ANEXOS_LC214[anexoKey]; T.cols.forEach((c, i) => { row5[c] = T.p[per][4][i]; }); } else Object.assign(row5, f5.partilha);
  const consumo = "ICMS" in row5 ? "ICMS" : "ISS";
  const eff5 = Math.max((rbt12 * n5 - pd5) / rbt12, 0);
  const sCons = (row5[consumo] || 0) / 100, sIbs = (row5.IBS || 0) / 100;
  const ivCons = eff5 * sCons, ivIbs = eff5 * sIbs, total = ivCons + ivIbs;
  const comp = {};
  const out = {
    aplica: true, rbt12, anexoKey, ano, periodo: per || "2026", eff5, n5, pd5, consumo, sCons, sIbs, ivCons, ivIbs, total,
    tetoAcionado: false, excedente: 0, tetoHipotese: false, fatores: null, comp,
  };
  const temTeto = consumo === "ISS" && per !== "2033";
  const conjunto = per && per !== "2728";                 // 2029-2032: o teto de 5% alcança ISS + IBS
  const base = sCons + (conjunto ? sIbs : 0);
  const combinado = eff5 * base;
  if (temTeto && base > 0 && combinado > ISS_TETO_PCT + 1e-12) {
    // fatores de redistribuição (em %): tabela publicada (Anexos III e IV) ou proporção da 5ª faixa sem ISS (e sem IBS quando o IBS fica fixo)
    const cap = ISS_TETO_5A_FAIXA[anexoKey];
    let fat = cap && per && cap.p[per] ? Object.assign({}, cap.p[per].fator) : null;
    if (!fat) {
      fat = {}; let s = 0;
      Object.keys(row5).forEach((k) => { if (k === consumo || (conjunto && k === "IBS")) return; s += row5[k]; });
      Object.keys(row5).forEach((k) => { if (k === consumo || (conjunto && k === "IBS")) return; fat[k] = (row5[k] / s) * 100; });
      out.tetoHipotese = anexoKey === "V" || !cap;
    }
    out.fatores = fat;
    out.tetoAcionado = true;
    out.excedente = combinado - ISS_TETO_PCT;
    comp[consumo] = conjunto ? ISS_TETO_PCT * (sCons / base) : ISS_TETO_PCT;
    if (conjunto) comp.IBS = ISS_TETO_PCT * (sIbs / base); else if (ivIbs > 0) comp.IBS = ivIbs;
    Object.keys(fat).forEach((k) => { comp[k] = (comp[k] || 0) + (out.excedente * fat[k]) / 100; });
  } else {
    if (ivCons > 0) comp[consumo] = ivCons;
    if (ivIbs > 0) comp.IBS = ivIbs;
  }
  return out;
}

// Base de CNAEs — classificação oficial CONCLA/IBGE (CNAE 2.3), carregada de
// /data/cnaes.json (ou de um arquivo JSON/CSV oficial importado pelo usuário).
// A partir do complemento "CNAE → Atividade → Presunção → IBS/CBS" (pedido
// explícito do usuário), esta base ALIMENTA automaticamente, quando possível
// com confiança, o Anexo do Simples Nacional, a atividade do Lucro Presumido
// e o tratamento de IBS/CBS — ver classificarPorCnae(), mais abaixo, e a
// seção 7 (revisada) do CONTEXTO-PROJETO-ANALISE-TRIBUTARIA.md. O usuário
// pode sempre substituir manualmente qualquer valor derivado.
let CNAE_DATA = null; // { meta, secoes[], divisoes[], grupos[], classes[], subclasses[] }
const CNAE_STATUS = {
  estado: "carregando", // "carregando" | "ok" | "erro"
  mensagem: "Carregando base de CNAEs (CONCLA/IBGE)...",
  registros: null,
  atualizadoEm: null,
  fonte: null,
};

function stripAccents(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function normSearch(s) {
  return stripAccents((s || "").toLowerCase()).trim();
}
function onlyDigits(s) {
  return (s || "").replace(/\D/g, "");
}
function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function fmtDateBR(iso) {
  if (!iso) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  return m[3] + "/" + m[2] + "/" + m[1];
}
function escHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Busca com ranking por relevância (tolerante a acentos): código completo,
// código parcial, descrição, palavra-chave (inclusive nas atividades
// específicas de cada subclasse — ex.: "promoção" encontra 7319-0/02).
function cnaeSearch(query, limit) {
  limit = limit || 12;
  if (!CNAE_DATA || !Array.isArray(CNAE_DATA.subclasses)) return [];
  const qRaw = (query || "").trim();
  if (!qRaw) return [];
  const qNorm = normSearch(qRaw);
  const qDigits = onlyDigits(qRaw);
  const wordRe = qNorm ? new RegExp("(^|\\s)" + escapeRegExp(qNorm)) : null;
  const scored = [];
  for (const s of CNAE_DATA.subclasses) {
    const codeDigits = onlyDigits(s.codigo);
    const descNorm = normSearch(s.descricao);
    let tier = -1;
    if (qDigits && codeDigits === qDigits) tier = 0;
    else if (qDigits && codeDigits.indexOf(qDigits) === 0) tier = 1;
    else if (qNorm && descNorm === qNorm) tier = 1;
    else if (qNorm && descNorm.indexOf(qNorm) === 0) tier = 2;
    else if (qNorm && wordRe && wordRe.test(descNorm)) tier = 3;
    else if (qNorm && descNorm.indexOf(qNorm) !== -1) tier = 4;
    else if (qDigits && codeDigits.indexOf(qDigits) !== -1) tier = 4;
    else if (qNorm && Array.isArray(s.atividades) && s.atividades.some((a) => normSearch(a).indexOf(qNorm) === 0)) tier = 5;
    else if (qNorm && Array.isArray(s.atividades) && s.atividades.some((a) => normSearch(a).indexOf(qNorm) !== -1)) tier = 6;
    if (tier >= 0) scored.push({ item: s, tier });
  }
  scored.sort((a, b) => a.tier - b.tier || a.item.codigo.localeCompare(b.item.codigo));
  return scored.slice(0, limit).map((x) => x.item);
}

function updateFontesCnaeRow() {
  const row = FONTES.find((f) => f.id === "cnae");

function cnaeHierarquia(sub) {

// Importação manual de base oficial (JSON no mesmo formato de cnaes.json, ou
// CSV com colunas equivalentes a codigo/descricao/secao/divisao/grupo/classe).
function parseCsvCnae(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === "," || c === ";") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0].map((h) => normSearch(h).replace(/[^a-z0-9]/g, ""));
  const idx = (names) => { for (const n of names) { const i = header.indexOf(n); if (i !== -1) return i; } return -1; };
  const iCod = idx(["codigo", "cod", "cnae", "subclasse"]);
  const iDesc = idx(["descricao", "desc", "denominacao", "descricaosubclasse"]);
  const iSec = idx(["secao"]);
  const iDiv = idx(["divisao"]);
  const iGrp = idx(["grupo"]);
  const iCla = idx(["classe"]);
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const cols = rows[r];
    if (!cols || iCod === -1 || !cols[iCod]) continue;
    out.push({
      codigo: (cols[iCod] || "").trim(),
      descricao: (cols[iDesc !== -1 ? iDesc : 1] || "").trim(),
      secao: iSec !== -1 ? (cols[iSec] || "").trim() : "",
      divisao: iDiv !== -1 ? (cols[iDiv] || "").trim() : "",
      grupo: iGrp !== -1 ? (cols[iGrp] || "").trim() : "",
      classe: iCla !== -1 ? (cols[iCla] || "").trim() : "",
      atividades: [],
    });
  }
  return out;
}
function normalizeImportedRecord(r) {
  return {
    codigo: String(r.codigo || r.code || "").trim(),
    descricao: String(r.descricao || r.description || "").trim(),
    secao: String(r.secao || "").trim(),
    divisao: String(r.divisao || "").trim(),
    grupo: String(r.grupo || "").trim(),
    classe: String(r.classe || "").trim(),
    atividades: Array.isArray(r.atividades) ? r.atividades : [],
  };
}
function importCnaeFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || "");
      let subclasses;
      const isJson = /\.json$/i.test(file.name) || /^\s*[{[]/.test(text);
      if (isJson) {
        const data = JSON.parse(text);
        subclasses = Array.isArray(data) ? data.map(normalizeImportedRecord) : Array.isArray(data.subclasses) ? data.subclasses.map(normalizeImportedRecord) : null;
        if (!subclasses) throw new Error("JSON não contém uma lista de CNAEs reconhecível");
      } else {
        subclasses = parseCsvCnae(text);
      }
      subclasses = subclasses.filter((s) => s.codigo && s.descricao);
      if (!subclasses.length) throw new Error("nenhum registro válido encontrado no arquivo");
      CNAE_DATA = { meta: { fonte: "Arquivo importado pelo usuário (" + file.name + ")", geradoEm: todayISO() }, secoes: [], divisoes: [], grupos: [], classes: [], subclasses };
      CNAE_STATUS.estado = "ok";
      CNAE_STATUS.registros = subclasses.length;
      CNAE_STATUS.atualizadoEm = todayISO();
      CNAE_STATUS.fonte = "Arquivo importado (" + file.name + ")";
      CNAE_STATUS.mensagem = "Base importada com sucesso a partir de " + file.name + ".";
    } catch (err) {
      CNAE_STATUS.estado = "erro";
      CNAE_STATUS.mensagem = "Falha ao importar \"" + file.name + "\": " + err.message + ".";
    }
    updateFontesCnaeRow();
    renderContent();
  };
  reader.onerror = () => {
    CNAE_STATUS.estado = "erro";
    CNAE_STATUS.mensagem = "Falha ao ler o arquivo \"" + file.name + "\".";
    updateFontesCnaeRow();
    renderContent();
  };
  reader.readAsText(file, "utf-8");
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Aplica o tratamento tributário selecionado (redução/benefício/regime
// específico) sobre a alíquota de REFERÊNCIA de um ano do cronograma
// IBS_CBS_CRONOGRAMA, retornando a composição completa: alíquota de
// referência, redução aplicada e alíquota efetiva de IBS e de CBS
// separadamente. Função pura e genérica — usada tanto pelo Simples Híbrido
// quanto pelo Lucro Presumido, para que a mesma regra de negócio nunca
// divirja entre as duas telas. Se o usuário informar uma alíquota efetiva
// TOTAL (IBS+CBS) manualmente, ela tem prioridade sobre o percentual de
// redução do tratamento selecionado — mantendo a MESMA proporção relativa
// entre IBS e CBS da alíquota de referência (não inventa uma nova
// composição entre os dois tributos).
function aplicarTratamentoIbsCbs(cronoAno, tratamento, aliquotaEfetivaManualPct) {
  const trat = tratamento || IBS_CBS_TRATAMENTOS.padrao;
  const ibsRefPct = (cronoAno && cronoAno.ibs) || 0;
  const cbsRefPct = (cronoAno && cronoAno.cbs) || 0;
  const refTotalPct = ibsRefPct + cbsRefPct;
  const manual = aliquotaEfetivaManualPct != null && aliquotaEfetivaManualPct !== "" && isFinite(aliquotaEfetivaManualPct);
  let ibsEfetivoPct, cbsEfetivoPct, reducaoAplicadaPct;
  if (manual) {
    const alvo = Math.max(parseFloat(aliquotaEfetivaManualPct), 0);
    const fator = refTotalPct > 0 ? alvo / refTotalPct : 0;
    ibsEfetivoPct = ibsRefPct * fator;
    cbsEfetivoPct = cbsRefPct * fator;
    reducaoAplicadaPct = refTotalPct > 0 ? Math.max(0, (1 - fator) * 100) : 0;
  } else {
    // Regimes "especifico"/"confirmar" não têm reducaoPct definido — sem
    // confirmação do usuário, NUNCA assumimos benefício: tratamos como 0%
    // de redução (alíquota cheia) até que o usuário ajuste manualmente.
    reducaoAplicadaPct = trat.reducaoPct != null ? trat.reducaoPct : 0;
    const fatorReducao = 1 - reducaoAplicadaPct / 100;
    ibsEfetivoPct = ibsRefPct * fatorReducao;
    cbsEfetivoPct = cbsRefPct * fatorReducao;
  }
  return {
    tratamento: trat, ibsRefPct, cbsRefPct, refTotalPct,
    ibsEfetivoPct, cbsEfetivoPct, efetivoTotalPct: ibsEfetivoPct + cbsEfetivoPct,
    reducaoAplicadaPct, manual,
  };
}

    if (resposta && spec.resolucoes[resposta]) return Object.assign({ pendente: false, complemento: spec.complemento }, spec.resolucoes[resposta]);
    return { pendente: true, complemento: spec.complemento };
  }
  return { pendente: false, key: spec.key, confianca: spec.confianca, fonte: spec.fonte, motivo: spec.motivo };
}

function montaClassificacao(cnae, spec) {
  const presuncao = resolverAspectoClassificacao(spec.presuncao);
  const ibscbs = resolverAspectoClassificacao(spec.ibscbs);
  const pendencias = [];
  if (presuncao && presuncao.pendente) pendencias.push(Object.assign({ aspecto: "presuncao" }, COMPLEMENTOS_CLASSIFICACAO[presuncao.complemento], { id: presuncao.complemento }));
  if (ibscbs && ibscbs.pendente) pendencias.push(Object.assign({ aspecto: "ibscbs" }, COMPLEMENTOS_CLASSIFICACAO[ibscbs.complemento], { id: ibscbs.complemento }));
  return { cnae, hierarquia: cnaeHierarquia(cnae), natureza: spec.natureza, presuncao, ibscbs, pendencias };
}

// Regra de classificação por CNAE — resolvida a partir da Seção/Divisão/
// Grupo/Classe do CNAE selecionado (mais específico prevalece sobre o
// genérico da Seção). Cada regra é fundamentada e traz seu próprio nível de
// confiança; nada aqui é uma alíquota nova — apenas a escolha, com fonte
// explícita, de qual entrada de PRESUNCAO/IBS_CBS_TRATAMENTOS já existente
// se aplica.
function classificarPorCnae() {
  const cnae = state.empresa.cnae;
  if (!cnae) return null;
  const secao = cnae.secao, divisao = cnae.divisao, grupo = cnae.grupo;
  const classeDigits = (cnae.classe || "").replace(/\D/g, "").slice(0, 4);

  // ---- Comércio varejista/atacadista de combustíveis (regra específica) ----
  if (grupo === "473" || classeDigits === "4681") {
    return montaClassificacao(cnae, {
      natureza: "comercio",
      presuncao: { modo: "direto", key: "revenda_combustiveis", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, I, "b"', motivo: "Grupo/classe de comércio de combustíveis — presunção reduzida de 1,6% de IRPJ." },
      ibscbs: { modo: "direto", key: "regime_especifico", confianca: "media", fonte: "LC 214/2025 — combustíveis possuem regime monofásico próprio de IBS/CBS", motivo: "Combustíveis não seguem a lógica padrão de alíquota de referência menos redução — confirme a apuração específica aplicável antes de usar o valor calculado como definitivo." },
    });
  }
  // ---- Transporte terrestre/aéreo de passageiros ----
  if (grupo === "492" || grupo === "511" || grupo === "495") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "transporte_passageiros", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, II, "c"', motivo: "Grupo de transporte de passageiros." },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução setorial identificada automaticamente para transporte de passageiros em geral — confirme eventual benefício específico (ex.: transporte público coletivo municipal)." },
    });
  }
  // ---- Transporte terrestre/aéreo/dutoviário de cargas ----
  if (grupo === "493" || grupo === "512" || grupo === "494") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "transporte_cargas", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, II, "c"', motivo: "Grupo de transporte de cargas." },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução setorial identificada automaticamente para transporte de cargas em geral." },
    });
  }
  // ---- Transporte aquaviário — ambíguo entre cargas e passageiros ----
  if (divisao === "50") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "complemento", complemento: "transporteAquaviario", resolucoes: {
        cargas: { key: "transporte_cargas", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, II, "c"', motivo: "Confirmado pelo usuário: transporte aquaviário de cargas." },
        passageiros: { key: "transporte_passageiros", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, II, "c"', motivo: "Confirmado pelo usuário: transporte aquaviário de passageiros." },
      } },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução setorial identificada automaticamente." },
    });
  }
  // ---- Saúde humana — Divisão 86 (conceito restritivo de "serviços hospitalares") ----
  if (divisao === "86") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "complemento", complemento: "servicosHospitalares", resolucoes: {
        sim_hospitalar: { key: "servicos_hospitalares", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, III, "a"; conceito de "serviços hospitalares" fixado por atos da Receita Federal e jurisprudência do CARF', motivo: "Confirmado pelo usuário: atividade atende à definição restritiva de serviços hospitalares." },
        nao_consultorio: { key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: 'Confirmado pelo usuário: consultório/clínica simples, sem a estrutura de "serviços hospitalares" exigida pela Receita Federal.' },
      } },
      ibscbs: { modo: "direto", key: "reducao60", confianca: "media", fonte: "LC 214/2025, art. 126 e Anexo II — serviços de saúde", motivo: "Serviços de saúde humana, em regra, sujeitos à redução de 60% — confirme se o serviço específico consta do Anexo II antes de usar como definitivo." },
    });
  }
  // ---- Assistência social / saúde integrada (Divisões 87-88) ----
  if (divisao === "87" || divisao === "88") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "servicos_gerais", confianca: "media", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Assistência social — em regra tributada pela presunção geral de serviços (32%), salvo estrutura hospitalar/de saúde equiparada específica (confirme se for o caso)." },
      ibscbs: { modo: "direto", key: "reducao60", confianca: "media", fonte: "LC 214/2025, art. 126 e Anexo II — assistência social", motivo: "Serviços de assistência social, em regra, sujeitos à redução de 60% — confirme o enquadramento específico." },
    });
  }
  // ---- Construção civil (Seção F) — depende de fornecimento de material ----
  if (secao === "F") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "complemento", complemento: "construcaoMaterial", resolucoes: {
        com_material: { key: "construcao_com_material", confianca: "alta", fonte: 'Lei 9.249/1995, art. 15, §1º, III, "a"', motivo: "Confirmado pelo usuário: empreitada com fornecimento de material." },
        sem_material: { key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Confirmado pelo usuário: empreitada apenas de mão de obra (sem fornecimento de material)." },
      } },
      ibscbs: { modo: "direto", key: "padrao", confianca: "baixa", fonte: "LC 214/2025", motivo: "A construção civil pode estar sujeita a regimes específicos de apuração (ex.: operações com bens imóveis) — confirme antes de aplicar o valor calculado como definitivo." },
    });
  }
  // ---- Instituições financeiras (Seção K) ----
  if (secao === "K") {
    return montaClassificacao(cnae, {
      natureza: "financeiro",
      presuncao: { modo: "direto", key: "instituicoes_financeiras", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, §1º, II", motivo: "Seção de atividades financeiras, de seguros e serviços relacionados." },
      ibscbs: { modo: "direto", key: "regime_especifico", confianca: "alta", fonte: "LC 214/2025 — serviços financeiros possuem regime específico próprio de IBS/CBS", motivo: "Serviços financeiros não seguem a lógica padrão de alíquota de referência menos redução; a apuração real exige metodologia própria, fora do escopo desta ferramenta." },
    });
  }
  // ---- Atividades profissionais/científicas/técnicas (Seção M, exceto veterinária) ----
  if (secao === "M" && divisao !== "75") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Atividades profissionais, científicas e técnicas em geral — presunção geral de serviços (32%)." },
      ibscbs: { modo: "complemento", complemento: "profissaoRegulamentada", resolucoes: {
        sim_regulamentada: { key: "reducao30_liberal", confianca: "media", fonte: "LC 214/2025 — regime específico para sociedades uniprofissionais/profissões regulamentadas", motivo: "Confirmado pelo usuário: sociedade uniprofissional/profissão regulamentada." },
        nao_regulamentada: { key: "padrao", confianca: "alta", fonte: "LC 214/2025", motivo: "Confirmado pelo usuário: não se trata de sociedade uniprofissional/profissão regulamentada — nenhuma redução específica identificada." },
      } },
    });
  }
  // ---- Atividades imobiliárias (Seção L) ----
  if (secao === "L") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "complemento", complemento: "atividadeImobiliaria", resolucoes: {
        venda_imoveis: { key: "comercio_industria", confianca: "media", fonte: "Lei 9.249/1995, art. 15, §4º — venda de imóveis (empresas que exploram a atividade)", motivo: "Confirmado pelo usuário: compra e venda de imóveis próprios." },
        locacao_imoveis: { key: "servicos_gerais", confianca: "media", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Confirmado pelo usuário: locação de imóveis próprios." },
        intermediacao: { key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Confirmado pelo usuário: intermediação/administração de imóveis de terceiros." },
      } },
      ibscbs: { modo: "direto", key: "regime_especifico", confianca: "media", fonte: "LC 214/2025 — operações com bens imóveis possuem regime específico próprio de IBS/CBS", motivo: "Operações com bens imóveis não seguem a lógica padrão de alíquota de referência menos redução." },
    });
  }
  // ---- Educação (Seção P) ----
  if (secao === "P") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Serviços de educação — presunção geral de serviços (32%); a lei não prevê percentual reduzido específico para educação." },
      ibscbs: { modo: "direto", key: "reducao60", confianca: "media", fonte: "LC 214/2025, art. 126 e Anexo II — serviços de educação", motivo: "Serviços de educação, em regra, sujeitos à redução de 60% — confirme se o serviço específico consta do Anexo II antes de usar como definitivo." },
    });
  }
  // ---- Comércio em geral (Seção G, exceto combustíveis já tratado acima) ----
  if (secao === "G") {
    return montaClassificacao(cnae, {
      natureza: "comercio",
      presuncao: { modo: "direto", key: "comercio_industria", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Comércio de mercadorias em geral." },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução identificada automaticamente para o comércio em geral — confirme se o produto específico consta da Cesta Básica Nacional (Anexo I) ou de alguma hipótese do Anexo II." },
    });
  }
  // ---- Indústria / extrativa / eletricidade e gás / água e saneamento ----
  if (secao === "B" || secao === "C" || secao === "D" || secao === "E") {
    return montaClassificacao(cnae, {
      natureza: "industria",
      presuncao: { modo: "direto", key: "comercio_industria", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Venda de produtos industrializados/extraídos — presunção geral de comércio/indústria (8%)." },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução identificada automaticamente — confirme se o produto específico consta de alguma hipótese de redução (Anexo I ou II)." },
    });
  }
  // ---- Agropecuária, pecuária, produção florestal, pesca e aquicultura (Seção A) ----
  if (secao === "A") {
    return montaClassificacao(cnae, {
      natureza: "comercio",
      presuncao: { modo: "direto", key: "comercio_industria", confianca: "media", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Produção e venda de produtos agropecuários por pessoa jurídica — presunção geral de comércio/indústria (8%); confirme se não se trata de atividade rural de pessoa física (regras próprias, fora do escopo desta ferramenta)." },
      ibscbs: { modo: "direto", key: "reducao60", confianca: "media", fonte: "LC 214/2025, art. 126 e Anexo II — insumos e produtos agropecuários e aquícolas", motivo: "Produtos agropecuários, em regra, sujeitos à redução de 60% — confirme se o produto específico consta efetivamente do Anexo II (ou do Anexo I, com alíquota zero, no caso de itens da cesta básica)." },
    });
  }
  // ---- Alojamento e alimentação (Seção I) ----
  if (secao === "I") {
    return montaClassificacao(cnae, {
      natureza: "servico",
      presuncao: { modo: "direto", key: "servicos_gerais", confianca: "alta", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Serviços de alojamento e alimentação — presunção geral de serviços (32%)." },
      ibscbs: { modo: "direto", key: "padrao", confianca: "media", fonte: "LC 214/2025", motivo: "Nenhuma redução identificada automaticamente." },
    });
  }
  // ---- Demais seções de serviços (J, N, O, Q-veterinária/75, R, S, T, U) — presunção
  // geral de serviços, sem redução de IBS/CBS identificável automaticamente. ----
  return montaClassificacao(cnae, {
    natureza: "servico",
    presuncao: { modo: "direto", key: "servicos_gerais", confianca: "media", fonte: "Lei 9.249/1995, art. 15, caput", motivo: "Prestação de serviços em geral, sem percentual reduzido específico previsto em lei para esta atividade — presunção geral de 32%." },
    ibscbs: { modo: "direto", key: "padrao", confianca: "baixa", fonte: "LC 214/2025", motivo: "Nenhuma hipótese de redução/isenção identificada automaticamente para esta atividade — confirme eventual enquadramento específico antes de assumir tratamento diferenciado." },
  });
}

// Valores efetivos (derivados) de atividade/tratamento IBS-CBS — nunca
// mutam os campos brutos de state (mesmo padrão de anexoKeyAtual()): em
// modo "manual", usam o valor escolhido pelo usuário; em modo "auto", usam
// a classificação por CNAE quando ela não estiver pendente de confirmação
// complementar, e caem no valor bruto (comportamento anterior, inalterado)
// quando não houver CNAE selecionado ou a classificação estiver pendente.
function atividadeKeyAtual() {
  if (state.presumido.atividadeModo === "manual") return state.presumido.atividade;
  const cls = classificarPorCnae();
  if (cls && cls.presuncao && !cls.presuncao.pendente) return cls.presuncao.key;
  return state.presumido.atividade;
}
function tratamentoIbsCbsKeyAtual() {
  if (state.ibscbs.modo === "manual") return state.ibscbs.tratamento;
  const cls = classificarPorCnae();
  if (cls && cls.ibscbs && !cls.ibscbs.pendente) return cls.ibscbs.key;
  return state.ibscbs.tratamento;
}
