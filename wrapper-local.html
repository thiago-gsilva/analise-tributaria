<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Análise Tributária</title>
<meta name="description" content="Sistema de simulação e comparação de regimes tributários — Simples Nacional, Fator R, IBS/CBS e Lucro Presumido, com relatório em PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   TOKENS — identidade visual fixa (dashboard financeiro premium).
   Paleta e hierarquia definidas deliberadamente; não segue tema claro/escuro
   do sistema — é uma identidade de marca única, como um relatório impresso.
   ========================================================================== */
:root{
  color-scheme: light;
  --navy:        #0F2747;
  --blue-deep:   #123B63;
  --blue-med:    #1769AA;
  --blue-light:  #EAF4FB;
  --green:       #10A36A;
  --green-dark:  #087A50;
  --green-light: #E8F7F1;
  --bg:          #F5F7FA;
  --white:       #FFFFFF;
  --text:        #334155;
  --text-sec:    #64748B;
  --border:      #E2E8F0;
  --red:         #DC4C64;
  --red-light:   #FCEAED;
  --yellow:      #D99A00;
  --yellow-light:#FEF6E4;
  --radius-card: 16px;
  --radius-sm:   10px;
  --shadow-card: 0 4px 16px rgba(15,39,71,.06);
  --shadow-pop:  0 12px 32px rgba(15,39,71,.14);
  --grad-navy:   linear-gradient(135deg,#0F2747,#1769AA);
  --grad-navygreen: linear-gradient(135deg,#123B63,#10A36A);
  --ff-body: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ff-display: 'Fraunces','Inter',serif;
  --sb-w: 264px;
  /* --heading: cor de texto de títulos/rótulos (separada de --navy, que também
     serve de FUNDO em botões/badges/cabeçalhos de tabela). Mantê-las
     independentes permite que o modo escuro clareie o texto sem mexer nos
     fundos de marca. */
  --heading: var(--navy);
}

/* ==========================================================================
   MODO ESCURO — paleta própria (não é uma inversão do modo claro).
   Duas rotas ativam o tema escuro: escolha explícita do usuário
   (data-theme="dark", persistida em localStorage) ou preferência do
   sistema operacional quando o usuário está em "Automático" (data-theme
   ausente/"system") e o SO pede prefers-color-scheme: dark.
   ========================================================================== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --navy:        #2563EB;
  --blue-deep:   #60A5FA;
  --blue-med:    #3B82F6;
  --blue-light:  rgba(59,130,246,.16);
  --green:       #22C55E;
  --green-dark:  #4ADE80;
  --green-light: rgba(34,197,94,.16);
  --bg:          #0B1220;
  --white:       #111C2E;
  --text:        #F8FAFC;
  --text-sec:    #CBD5E1;
  --border:      #24344D;
  --red:         #F87171;
  --red-light:   rgba(248,113,113,.14);
  --yellow:      #F59E0B;
  --yellow-light:rgba(245,158,11,.14);
  --heading:     #F8FAFC;
  --shadow-card: 0 4px 16px rgba(0,0,0,.4);
  --shadow-pop:  0 14px 34px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    color-scheme: dark;
    --navy:        #2563EB;
    --blue-deep:   #60A5FA;
    --blue-med:    #3B82F6;
    --blue-light:  rgba(59,130,246,.16);
    --green:       #22C55E;
    --green-dark:  #4ADE80;
    --green-light: rgba(34,197,94,.16);
    --bg:          #0B1220;
    --white:       #111C2E;
    --text:        #F8FAFC;
    --text-sec:    #CBD5E1;
    --border:      #24344D;
    --red:         #F87171;
    --red-light:   rgba(248,113,113,.14);
    --yellow:      #F59E0B;
    --yellow-light:rgba(245,158,11,.14);
    --heading:     #F8FAFC;
    --shadow-card: 0 4px 16px rgba(0,0,0,.4);
    --shadow-pop:  0 14px 34px rgba(0,0,0,.55);
  }
}

/* ---- Correções de literais fixos (não-token) para o modo escuro ---- */
:root[data-theme="dark"] tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
:root[data-theme="dark"] tbody tr:hover td{background:rgba(59,130,246,.09)}
:root[data-theme="dark"] .acc-head:hover{background:rgba(255,255,255,.025)}
:root[data-theme="dark"] .acc-body{background:rgba(255,255,255,.015)}
:root[data-theme="dark"] .field input::placeholder{color:#7C8CA6}
:root[data-theme="dark"] .field input:focus,
:root[data-theme="dark"] .field select:focus,
:root[data-theme="dark"] .field textarea:focus{box-shadow:0 0 0 3px rgba(59,130,246,.22)}
:root[data-theme="dark"] .stepper-toolbar{background:rgba(11,18,32,.92)}
:root[data-theme="dark"] .alert-green{color:#4ADE80;border-color:rgba(34,197,94,.35)}
:root[data-theme="dark"] .alert-red{color:#F87171;border-color:rgba(248,113,113,.35)}
:root[data-theme="dark"] .alert-yellow{color:#F59E0B;border-color:rgba(245,158,11,.35)}
:root[data-theme="dark"] .badge-yellow{color:#F59E0B}
:root[data-theme="dark"] .btn-primary:hover{background:#2E6FE0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]) tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) tbody tr:hover td{background:rgba(59,130,246,.09)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .acc-head:hover{background:rgba(255,255,255,.025)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .acc-body{background:rgba(255,255,255,.015)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .field input::placeholder{color:#7C8CA6}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .field input:focus,
  :root:not([data-theme="light"]):not([data-theme="dark"]) .field select:focus,
  :root:not([data-theme="light"]):not([data-theme="dark"]) .field textarea:focus{box-shadow:0 0 0 3px rgba(59,130,246,.22)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .stepper-toolbar{background:rgba(11,18,32,.92)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .alert-green{color:#4ADE80;border-color:rgba(34,197,94,.35)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .alert-red{color:#F87171;border-color:rgba(248,113,113,.35)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .alert-yellow{color:#F59E0B;border-color:rgba(245,158,11,.35)}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .badge-yellow{color:#F59E0B}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .btn-primary:hover{background:#2E6FE0}
}

/* Transições curtas (150-250ms) para troca de tema — não afeta elementos que
   já definem sua própria transição mais específica (hover/foco continuam
   como antes). Respeita prefers-reduced-motion (regra já existente abaixo). */
body,.card,.card-flat,.sidebar,.topbar,thead th,tbody td,.accordion,.ac-list,.ac-item,
.badge,.alert,.meta-pill,.source-row,.table-wrap,.divider,.logo-slot,.theme-btn,
h1,h2,h3,h4,a,.muted,.tabs,.tab-btn,.checkbox-row,.field label,.field .hint{
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:auto}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--ff-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--ff-body);color:var(--heading);margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
a{color:var(--blue-med)}
::selection{background:var(--green-light);color:var(--heading)}
.num{font-variant-numeric:tabular-nums}

/* focus visibility (acessibilidade) */
:focus-visible{outline:2px solid var(--blue-med);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* ==========================================================================
   LAYOUT
   ========================================================================== */
.app{
  display:flex;
  min-height:100%;
  max-width:1600px;
  margin:0 auto;
}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sb-w);
  flex:0 0 var(--sb-w);
  background:var(--white);
  border-right:1px solid var(--border);
  padding:20px 14px 24px;
  position:sticky;
  top:0;
  align-self:flex-start;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:20;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 14px;
  border-bottom:1px solid var(--border);
}
.sidebar-brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:var(--grad-navygreen);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.sidebar-brand .mark svg{width:19px;height:19px;stroke:#fff}
.sidebar-brand .txt{display:flex;flex-direction:column;line-height:1.15}
.sidebar-brand .txt strong{font-size:14.5px;font-weight:800;color:var(--heading);letter-spacing:-.01em}
.sidebar-brand .txt span{font-size:11px;color:var(--text-sec)}

.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  color:var(--heading);text-decoration:none;
  font-size:13.5px;font-weight:500;
  border:none;background:transparent;cursor:pointer;
  text-align:left;width:100%;
  position:relative;
  transition:background .18s ease,color .18s ease;
}
.nav-item svg{width:17px;height:17px;stroke:var(--heading);flex:0 0 auto;opacity:.72;transition:opacity .18s ease,stroke .18s ease}
.nav-item:hover{background:var(--blue-light)}
.nav-item[aria-current="page"]{background:var(--blue-light);color:var(--blue-deep);font-weight:600}
.nav-item[aria-current="page"] svg{opacity:1;stroke:var(--blue-deep)}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  background:var(--green);border-radius:0 3px 3px 0;
}
.nav-group-label{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-sec);
  text-transform:uppercase;padding:12px 12px 2px;
}
.sidebar-foot{
  border-top:1px solid var(--border);padding-top:12px;
  font-size:11px;color:var(--text-sec);padding-left:12px;
}

/* ---- Main column ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---- Header ---- */
.topbar{
  background:var(--grad-navy);
  color:#fff;
  padding:22px 32px;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--green),transparent 60%);
}
.topbar-title h1{color:#fff;font-size:26px;font-weight:700;letter-spacing:-.01em}
.topbar-title p{color:#BFD6EA;font-size:13.5px;margin-top:3px}
.topbar-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta-pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:8px 13px;font-size:11.5px;color:#DCEAF5;
  display:flex;flex-direction:column;gap:2px;min-width:88px;
}
.meta-pill strong{font-size:13.5px;color:#fff;font-weight:700}
.menu-toggle{display:none}

/* ---- Alternador de tema (claro / escuro / sistema) ---- */
.theme-toggle{
  display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:3px;flex:0 0 auto;
}
.theme-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;
  background:transparent;border:none;cursor:pointer;
  color:#BFD6EA;transition:background .18s ease,color .18s ease;
}
.theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.theme-btn.active{background:var(--green);color:#fff}
.theme-btn:focus-visible{outline:2px solid #fff;outline-offset:1px}

.content{padding:26px 32px 60px;display:flex;flex-direction:column;gap:24px}
.section{display:flex;flex-direction:column;gap:20px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-head h2{font-size:22px;font-weight:700}
.section-head .sub{font-size:13px;color:var(--text-sec);margin-top:3px}
.section-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ==========================================================================
   CARDS
   ========================================================================== */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  padding:22px;
}
.card-flat{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px}
.card-title{font-size:15px;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-title svg{width:17px;height:17px;stroke:var(--blue-med)}
.card-title .grow{flex:1}

.grid{display:grid;gap:18px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

/* ---- KPI cards ---- */
.kpi{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);padding:18px 20px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .18s ease,box-shadow .18s ease,background-color .2s ease,border-color .2s ease;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-icon{width:34px;height:34px;border-radius:9px;background:var(--blue-light);display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:17px;height:17px;stroke:var(--blue-deep)}
.kpi-icon.green{background:var(--green-light)}
.kpi-icon.green svg{stroke:var(--green-dark)}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sec)}
.kpi-value{font-size:27px;font-weight:800;color:var(--heading);letter-spacing:-.02em}
.kpi-value.green{color:var(--green-dark)}
.kpi-sub{font-size:12px;color:var(--text-sec)}
.kpi-sub.up{color:var(--green-dark);font-weight:600}

/* ---- Regime cards ---- */
.regime-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);padding:22px;display:flex;flex-direction:column;gap:14px;
  border-top:3px solid var(--blue-deep);transition:box-shadow .2s ease,transform .2s ease,background-color .2s ease,border-color .2s ease;
}
.regime-card:hover{box-shadow:var(--shadow-pop);transform:translateY(-2px)}
.regime-card.selected{border-color:var(--green);box-shadow:0 0 0 1px var(--green),var(--shadow-pop)}
.regime-card .rh{display:flex;align-items:center;justify-content:space-between}
.regime-card h3{font-size:15.5px;font-weight:700}
.regime-card .val{font-size:26px;font-weight:800;color:var(--heading)}
.regime-card .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-sec);padding:6px 0;border-top:1px dashed var(--border)}
.regime-card .row b{color:var(--text);font-weight:600}

/* ==========================================================================
   FORM / INPUTS
   ========================================================================== */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--heading)}
.field .hint{font-size:11px;color:var(--text-sec)}
.cnae-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.cnae-status .btn{padding:5px 10px;font-size:11.5px}
.cnae-status .btn svg{width:13px;height:13px}
.field input[type="text"],.field input[type="number"],.field select,.field textarea{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:13.5px;color:var(--text);background:var(--white);
  font-family:inherit;transition:border-color .16s ease,box-shadow .16s ease,background-color .2s ease,color .2s ease;
  width:100%;
}
.field input::placeholder{color:#A9B4C2}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blue-med);box-shadow:0 0 0 3px rgba(23,105,170,.14);outline:none;
}
.field-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge-inline{display:inline-flex}
.checkbox-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text)}
.checkbox-row input{width:16px;height:16px;accent-color:var(--green)}
.radio-pills{display:flex;gap:8px;flex-wrap:wrap}
.radio-pill{
  border:1px solid var(--border);background:var(--white);border-radius:10px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text-sec);cursor:pointer;
  transition:all .16s ease;
}
.radio-pill.active{border-color:var(--blue-med);background:var(--blue-light);color:var(--blue-deep)}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:600;
  cursor:pointer;border:1px solid transparent;transition:all .18s ease;
  line-height:1;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--blue-med)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:var(--green-dark)}
.btn-secondary{background:var(--white);border-color:var(--border);color:var(--blue-deep)}
.btn-secondary:hover{background:var(--blue-light);border-color:var(--blue-med)}
.btn-ghost{background:transparent;color:var(--text-sec);border-color:transparent}
.btn-ghost:hover{background:var(--bg);color:var(--heading)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}

/* ==========================================================================
   BADGES / ALERTS
   ========================================================================== */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:4px 9px;border-radius:100px;line-height:1.3;white-space:nowrap;
}
.badge svg{width:11px;height:11px}
.badge-green{background:var(--green-light);color:var(--green-dark)}
.badge-blue{background:var(--blue-light);color:var(--blue-deep)}
.badge-yellow{background:var(--yellow-light);color:#8A6300}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-navy{background:var(--navy);color:#fff}

.alert{
  border-radius:12px;padding:13px 16px;display:flex;gap:11px;align-items:flex-start;
  font-size:13px;border:1px solid transparent;
}
.alert svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.alert b{font-weight:700}
.alert-green{background:var(--green-light);color:#0B6E4C;border-color:#BFE9D8}
.alert-green svg{stroke:var(--green-dark)}
.alert-yellow{background:var(--yellow-light);color:#8A6300;border-color:#F3DFA3}
.alert-yellow svg{stroke:var(--yellow)}
.alert-red{background:var(--red-light);color:#A5273D;border-color:#F3C4CD}
.alert-red svg{stroke:var(--red)}
.alert-blue{background:var(--blue-light);color:var(--blue-deep);border-color:#CFE6F5}
.alert-blue svg{stroke:var(--blue-med)}

/* ==========================================================================
   TABLES
   ========================================================================== */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{
  background:var(--navy);color:#fff;text-align:left;font-weight:600;
  padding:11px 14px;font-size:12px;white-space:nowrap;
}
thead th.num,tbody td.num{text-align:right}
tbody td{padding:10px 14px;border-top:1px solid var(--border);color:var(--text)}
tbody tr:nth-child(even){background:#FAFBFD}
tbody tr.total td{background:var(--green-light);font-weight:700;color:var(--green-dark);border-top:2px solid var(--green)}
tbody tr.hl td{background:var(--blue-light)}
tbody tr:hover td{background:#F1F6FB}

/* ==========================================================================
   TABS (sub-navegação dentro de seção)
   ========================================================================== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-btn{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-sec);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  transition:color .16s ease,border-color .16s ease;margin-bottom:-1px;
}

/* ==========================================================================

.accordion{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.accordion+.accordion{margin-top:10px}
.acc-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  background:var(--white);user-select:none;
}
.acc-head:hover{background:#FAFBFD}
.acc-head svg.chev{width:15px;height:15px;stroke:var(--text-sec);transition:transform .2s ease;margin-left:auto}
.accordion.open .acc-head svg.chev{transform:rotate(180deg)}
.acc-head .step-badge{
  width:24px;height:24px;border-radius:7px;background:var(--blue-light);color:var(--blue-deep);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 auto;
}
.acc-body{

  background:#FAFBFD;border-top:1px solid transparent;
}
.accordion.open .acc-body{border-top:1px solid var(--border)}
.acc-body-inner{padding:14px 18px 18px 50px;font-size:13px;color:var(--text);display:flex;flex-direction:column;gap:8px}
.formula{

  background:var(--blue-light);color:var(--blue-deep);padding:9px 12px;border-radius:8px;
  overflow-x:auto;
}

/* ==========================================================================

.result-banner{

}
.result-banner .rb-head{display:flex;align-items:center;gap:10px}
.result-banner .rb-head svg{width:22px;height:22px;stroke:#fff}
.result-banner .rb-head h3{color:#fff;font-size:18px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.result-item{display:flex;flex-direction:column;gap:3px}
.result-item .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#CFE6DF}
.result-item .v{font-size:19px;font-weight:800}

.divider{height:1px;background:var(--border);margin:4px 0}

// /data/cnaes.json (ou de um arquivo JSON/CSV oficial importado pelo usuário).
// Esta base é puramente classificatória: NÃO determina automaticamente o
// Anexo do Simples Nacional nem a atividade do Lucro Presumido — essas
// definições usam exclusivamente a base tributária já existente no projeto
// (ANEXOS, PRESUNCAO, motor de Fator R) e a escolha explícita do usuário.
let CNAE_DATA = null; // { meta, secoes[], divisoes[], grupos[], classes[], subclasses[] }
const CNAE_STATUS = {
  estado: "carregando", // "carregando" | "ok" | "erro"
  mensagem: "Carregando base de CNAEs (CONCLA/IBGE)...",
  registros: null,
  atualizadoEm: null,
  fonte: null,
};

function stripAccents(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function normSearch(s) {
  return stripAccents((s || "").toLowerCase()).trim();
}
function onlyDigits(s) {
  return (s || "").replace(/\D/g, "");
}
function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}
function fmtDateBR(iso) {
  if (!iso) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  return m[3] + "/" + m[2] + "/" + m[1];
}
function escHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Busca com ranking por relevância (tolerante a acentos): código completo,
// código parcial, descrição, palavra-chave (inclusive nas atividades
// específicas de cada subclasse — ex.: "promoção" encontra 7319-0/02).
function cnaeSearch(query, limit) {
  limit = limit || 12;
  if (!CNAE_DATA || !Array.isArray(CNAE_DATA.subclasses)) return [];
  const qRaw = (query || "").trim();
  if (!qRaw) return [];
  const qNorm = normSearch(qRaw);
  const qDigits = onlyDigits(qRaw);
  const wordRe = qNorm ? new RegExp("(^|\\s)" + escapeRegExp(qNorm)) : null;
  const scored = [];
  for (const s of CNAE_DATA.subclasses) {
    const codeDigits = onlyDigits(s.codigo);
    const descNorm = normSearch(s.descricao);
    let tier = -1;
    if (qDigits && codeDigits === qDigits) tier = 0;
    else if (qDigits && codeDigits.indexOf(qDigits) === 0) tier = 1;
    else if (qNorm && descNorm === qNorm) tier = 1;
    else if (qNorm && descNorm.indexOf(qNorm) === 0) tier = 2;
    else if (qNorm && wordRe && wordRe.test(descNorm)) tier = 3;
    else if (qNorm && descNorm.indexOf(qNorm) !== -1) tier = 4;
    else if (qDigits && codeDigits.indexOf(qDigits) !== -1) tier = 4;
    else if (qNorm && Array.isArray(s.atividades) && s.atividades.some((a) => normSearch(a).indexOf(qNorm) === 0)) tier = 5;
    else if (qNorm && Array.isArray(s.atividades) && s.atividades.some((a) => normSearch(a).indexOf(qNorm) !== -1)) tier = 6;
    if (tier >= 0) scored.push({ item: s, tier });
  }
  scored.sort((a, b) => a.tier - b.tier || a.item.codigo.localeCompare(b.item.codigo));
  return scored.slice(0, limit).map((x) => x.item);
}

// Cabeçalho de hierarquia (Seção/Divisão/Grupo/Classe) de uma subclasse, a

function cnaeHierarquia(sub) {

  return {

}

// Importação manual de base oficial (JSON no mesmo formato de cnaes.json, ou
// CSV com colunas equivalentes a codigo/descricao/secao/divisao/grupo/classe).
function parseCsvCnae(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === "," || c === ";") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0].map((h) => normSearch(h).replace(/[^a-z0-9]/g, ""));
  const idx = (names) => { for (const n of names) { const i = header.indexOf(n); if (i !== -1) return i; } return -1; };
  const iCod = idx(["codigo", "cod", "cnae", "subclasse"]);
  const iDesc = idx(["descricao", "desc", "denominacao", "descricaosubclasse"]);
  const iSec = idx(["secao"]);
  const iDiv = idx(["divisao"]);
  const iGrp = idx(["grupo"]);
  const iCla = idx(["classe"]);
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const cols = rows[r];
    if (!cols || iCod === -1 || !cols[iCod]) continue;
    out.push({
      codigo: (cols[iCod] || "").trim(),
      descricao: (cols[iDesc !== -1 ? iDesc : 1] || "").trim(),
      secao: iSec !== -1 ? (cols[iSec] || "").trim() : "",
      divisao: iDiv !== -1 ? (cols[iDiv] || "").trim() : "",
      grupo: iGrp !== -1 ? (cols[iGrp] || "").trim() : "",
      classe: iCla !== -1 ? (cols[iCla] || "").trim() : "",
      atividades: [],
    });
  }
  return out;
}
function normalizeImportedRecord(r) {
  return {
    codigo: String(r.codigo || r.code || "").trim(),
    descricao: String(r.descricao || r.description || "").trim(),
    secao: String(r.secao || "").trim(),
    divisao: String(r.divisao || "").trim(),
    grupo: String(r.grupo || "").trim(),
    classe: String(r.classe || "").trim(),
    atividades: Array.isArray(r.atividades) ? r.atividades : [],
  };
}
function importCnaeFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || "");
      let subclasses;
      const isJson = /\.json$/i.test(file.name) || /^\s*[{[]/.test(text);
      if (isJson) {
        const data = JSON.parse(text);
        subclasses = Array.isArray(data) ? data.map(normalizeImportedRecord) : Array.isArray(data.subclasses) ? data.subclasses.map(normalizeImportedRecord) : null;
        if (!subclasses) throw new Error("JSON não contém uma lista de CNAEs reconhecível");
      } else {
        subclasses = parseCsvCnae(text);
      }
      subclasses = subclasses.filter((s) => s.codigo && s.descricao);
      if (!subclasses.length) throw new Error("nenhum registro válido encontrado no arquivo");
      CNAE_DATA = { meta: { fonte: "Arquivo importado pelo usuário (" + file.name + ")", geradoEm: todayISO() }, secoes: [], divisoes: [], grupos: [], classes: [], subclasses };
      CNAE_STATUS.estado = "ok";
      CNAE_STATUS.registros = subclasses.length;
      CNAE_STATUS.atualizadoEm = todayISO();
      CNAE_STATUS.fonte = "Arquivo importado (" + file.name + ")";
      CNAE_STATUS.mensagem = "Base importada com sucesso a partir de " + file.name + ".";
    } catch (err) {
      CNAE_STATUS.estado = "erro";
      CNAE_STATUS.mensagem = "Falha ao importar \"" + file.name + "\": " + err.message + ".";
    }
    updateFontesCnaeRow();
    renderContent();
  };
  reader.onerror = () => {
    CNAE_STATUS.estado = "erro";
    CNAE_STATUS.mensagem = "Falha ao ler o arquivo \"" + file.name + "\".";
    updateFontesCnaeRow();
    renderContent();
  };
  reader.readAsText(file, "utf-8");
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* ---------------------------------------------------------------------------
   ENGINE — funções puras de cálculo
   --------------------------------------------------------------------------- */
function getFaixaIndex(rbt12) {
  if (rbt12 <= 0) return 0;
  for (let i = 0; i < FAIXAS_LIMITES.length; i++) if (rbt12 <= FAIXAS_LIMITES[i].max) return i;
  return FAIXAS_LIMITES.length - 1;
}
function calcAliquotaEfetiva(rbt12, anexoKey) {
  const anexo = ANEXOS[anexoKey];
  const idx = getFaixaIndex(rbt12);
  const faixa = anexo.faixas[idx];
  if (rbt12 <= 0) return { aliqEfetiva: 0, idx, faixa };
  const aliqEfetiva = (rbt12 * faixa.aliq - faixa.ded) / rbt12;
  return { aliqEfetiva: Math.max(aliqEfetiva, 0), idx, faixa };
}
function calcFatorR(folha12m, rbt12) { return rbt12 <= 0 ? 0 : folha12m / rbt12; }
// Auxiliar somente informativo (usado no slide "Fator R" do relatório em PDF):
// folha de salários (12 meses) necessária para atingir o limiar de 28% do
// Fator R, dado o RBT12 atual. Não altera a regra de enquadramento em si
// (calcFatorR/calcSimplesNacional) — é apenas um valor de referência exibido.
function calcFolhaNecessariaFatorR(rbt12) { return rbt12 * 0.28; }

function calcSimplesNacional({ faturamentoMensal, rbt12, anexoKey, folha12m }) {
  let anexoUsado = anexoKey, fatorR = null;
  if (anexoKey === "III_V") {
    fatorR = calcFatorR(folha12m || 0, rbt12);
    anexoUsado = fatorR >= 0.28 ? "III" : "V";
  }
  const { aliqEfetiva, idx, faixa } = calcAliquotaEfetiva(rbt12, anexoUsado);
  const dasMensal = faturamentoMensal * aliqEfetiva;
  const partilhaValores = {};
  Object.keys(faixa.partilha).forEach((t) => (partilhaValores[t] = dasMensal * (faixa.partilha[t] / 100)));
  return {
    anexoUsado, faixaIndex: idx + 1, faixaLabel: (idx + 1) + "ª faixa",
    aliqNominal: faixa.aliq, parcelaDeduzir: faixa.ded, aliqEfetiva,
    dasMensal, dasAnual: dasMensal * 12, cargaEfetivaPct: aliqEfetiva * 100,
    partilha: faixa.partilha, partilhaValores, fatorR, rbt12,
  };
}

function calcLucroPresumidoTrimestral({ receitaTrimestre, atividade, pisAliq, cofinsAliq, issAliq, aplicarMajoracao2026, anoProjecao }) {
  const pres = PRESUNCAO[atividade];
  let irpjPct = pres.irpj, csllPct = pres.csll, baseIRPJ, baseCSLL, notaMajoracao = null;
  if (aplicarMajoracao2026 && receitaTrimestre > 1250000) {
    const parteNormal = 1250000, parteMajorada = receitaTrimestre - 1250000;
    const irpjMajPct = irpjPct * 1.10, csllMajPct = csllPct * 1.10;
    baseIRPJ = parteNormal * (irpjPct / 100) + parteMajorada * (irpjMajPct / 100);
    baseCSLL = parteNormal * (csllPct / 100) + parteMajorada * (csllMajPct / 100);
    notaMajoracao = { irpjMajPct, csllMajPct, parteMajorada };
  } else {
    baseIRPJ = receitaTrimestre * (irpjPct / 100);
    baseCSLL = receitaTrimestre * (csllPct / 100);
  }
  const irpjNormal = baseIRPJ * 0.15;
  const adicionalBase = Math.max(baseIRPJ - 60000, 0);
  const irpjAdicional = adicionalBase * 0.10;
  const irpjTotal = irpjNormal + irpjAdicional;
  const csllTotal = baseCSLL * 0.09;

  // ---- Tributos sobre o consumo (PIS/COFINS ou CBS/IBS + ISS) ----
  // Apurados mensalmente na prática; aqui somados sobre a receita do
  // trimestre. Usa o MESMO cronograma de transição já existente no projeto
  // (IBS_CBS_CRONOGRAMA, usado também na aba Simples Híbrido) — nenhuma
  // alíquota nova é inventada aqui. A partir de 2027 a Lei Complementar
  // 214/2025 extingue PIS/COFINS (substituídos pela CBS); em 2026 (ano-teste)
  // os valores de CBS/IBS são integralmente compensáveis com PIS/COFINS, sem
  // impacto financeiro líquido, por isso o ano-teste mantém PIS/COFINS/ISS
  // como os tributos efetivamente vigentes.
  const ano = anoProjecao || 2027;
  const crono = IBS_CBS_CRONOGRAMA.find((c) => c.ano === ano) || IBS_CBS_CRONOGRAMA[IBS_CBS_CRONOGRAMA.length - 1];
  const substituidoPorCbs = ano >= 2027;
  const fatorRemanescenteIss = crono.issIcmsFatorRemanescente != null ? crono.issIcmsFatorRemanescente : 1;
  const issAliqEfetiva = substituidoPorCbs ? issAliq * fatorRemanescenteIss : issAliq;
  let pis = 0, cofins = 0, cbs = 0, ibs = 0;
  if (substituidoPorCbs) {
    cbs = receitaTrimestre * (crono.cbs / 100);
    ibs = receitaTrimestre * (crono.ibs / 100);
  } else {
    pis = receitaTrimestre * pisAliq;
    cofins = receitaTrimestre * cofinsAliq;
  }
  const iss = receitaTrimestre * issAliqEfetiva;
  const consumoTotal = pis + cofins + cbs + ibs + iss;
  const totalTrimestre = irpjTotal + csllTotal + consumoTotal;
  return {
    atividade: pres.label, irpjPctUsado: irpjPct, csllPctUsado: csllPct, baseIRPJ, baseCSLL,
    irpjNormal, irpjAdicional, irpjTotal, csllTotal,
    pis, cofins, cbs, ibs, iss, consumoTotal,
    issAliqEfetivaPct: issAliqEfetiva * 100, fatorRemanescenteIss,
    ano, substituidoPorCbs, crono,
    totalTrimestre,
    cargaEfetivaPct: receitaTrimestre > 0 ? (totalTrimestre / receitaTrimestre) * 100 : 0, notaMajoracao,
  };
}
function calcLucroPresumidoAnual(params) {
  const t = calcLucroPresumidoTrimestral(params);
  return { receitaAnual: params.receitaTrimestre * 4, totalAnual: t.totalTrimestre * 4, trimestre: t, cargaEfetivaPct: t.cargaEfetivaPct };
}
// Generaliza o ponto de equilíbrio: receita mensal necessária para atingir um
// resultado-alvo (não apenas zero), dados custos fixos, % de custos variáveis
// e a carga tributária efetiva (%) incidente sobre a receita.
function calcReceitaParaResultado({ resultadoDesejadoMensal, custosFixosMensais, custosVariaveisPct, cargaTributariaPct }) {
  const comprometido = (custosVariaveisPct + cargaTributariaPct) / 100;
  if (comprometido >= 1) return { valido: false };
  const receita = (resultadoDesejadoMensal + custosFixosMensais) / (1 - comprometido);
  return { valido: true, receita, margemContribuicaoPct: (1 - comprometido) * 100 };
}
function calcPontoEquilibrio({ custosFixosMensais, custosVariaveisPct, cargaTributariaPct }) {
  const res = calcReceitaParaResultado({ resultadoDesejadoMensal: 0, custosFixosMensais, custosVariaveisPct, cargaTributariaPct });
  if (!res.valido) return { valido: false };
  return { valido: true, receitaEquilibrio: res.receita, margemContribuicaoPct: res.margemContribuicaoPct };
}
function calcBrutoParaLiquido(bruto, cargaPct) { return bruto * (1 - cargaPct / 100); }
function calcLiquidoParaBruto(liquido, cargaPct) { const f = 1 - cargaPct / 100; return f <= 0 ? null : liquido / f; }

/* ---------------------------------------------------------------------------
   ENGINE — Simples Híbrido (IBS/CBS apurados à parte do DAS, mecanismo não
   cumulativo previsto a partir de 2027 — EC 132/2023, LC 214/2025).
   Usa exclusivamente parâmetros já existentes no sistema (partilha dos Anexos
   e cronograma IBS_CBS_CRONOGRAMA); os únicos valores ajustáveis pelo usuário
   são percentuais de CRÉDITO, que dependem do perfil de insumos/compras de
   cada empresa e por isso não são — e não devem ser — alíquotas fixas do
   sistema. Sem informação em contrário, tratamos o crédito como 0 (não
   assumido), nunca como integral.
   --------------------------------------------------------------------------- */
function calcSimplesHibrido({ faturamentoMensal, dasMensal, partilha, partilhaValores, cronoAno, creditoIbsPct, creditoCbsPct }) {
  // Parcelas do DAS hoje embutidas que correspondem aos tributos sobre
  // consumo substituídos pela reforma: ICMS (Anexo I/II) ou ISS (Anexo
  // III/IV/V) → viram IBS; PIS e COFINS (federais) → viram CBS. É essa soma
  // que sai da partilha do Simples e passa a ser apurada separadamente no
  // mecanismo à parte. IRPJ, CSLL e CPP não são afetados pela reforma e
  // permanecem no DAS sem IBS/CBS.
  const tributoConsumo = partilha.ICMS != null ? "ICMS" : (partilha.ISS != null ? "ISS" : null);
  const parcelaIbsNoDas = (partilhaValores.ICMS || 0) + (partilhaValores.ISS || 0);
  const parcelaCbsNoDas = (partilhaValores.COFINS || 0) + (partilhaValores.PIS || 0);
  const parcelaConsumoDas = parcelaIbsNoDas + parcelaCbsNoDas;
  const dasSemIbsCbs = Math.max(dasMensal - parcelaConsumoDas, 0);

  const ibsDebito = faturamentoMensal * ((cronoAno.ibs || 0) / 100);
  const cbsDebito = faturamentoMensal * ((cronoAno.cbs || 0) / 100);
  const creditoIbs = ibsDebito * ((creditoIbsPct || 0) / 100);
  const creditoCbs = cbsDebito * ((creditoCbsPct || 0) / 100);
  const ibsLiquido = Math.max(ibsDebito - creditoIbs, 0);
  const cbsLiquido = Math.max(cbsDebito - creditoCbs, 0);
  const totalIbsCbsLiquido = ibsLiquido + cbsLiquido;
  const totalMensal = dasSemIbsCbs + totalIbsCbsLiquido;

  return {
    ano: cronoAno.ano, ibsPct: cronoAno.ibs || 0, cbsPct: cronoAno.cbs || 0, tributoConsumo,
    parcelaIbsNoDas, parcelaCbsNoDas, parcelaConsumoDas, dasSemIbsCbs,
    ibsDebito, cbsDebito, creditoIbsPct: creditoIbsPct || 0, creditoCbsPct: creditoCbsPct || 0,
    creditoIbs, creditoCbs, ibsLiquido, cbsLiquido,
    totalIbsCbsLiquido, totalMensal, totalAnual: totalMensal * 12,
    cargaEfetivaPct: faturamentoMensal > 0 ? (totalMensal / faturamentoMensal) * 100 : 0,
  };
}

// CONTRATANTE — crédito potencial de IBS/CBS sobre um valor de contratação e
// custo líquido resultante. creditoPct é parâmetro de simulação (não assumir
// crédito integral — depende das condições legais aplicáveis à operação).
function calcCreditoContratante({ valorContrato, creditoPct, ibsPct, cbsPct }) {
  const creditoIbs = valorContrato * ((ibsPct || 0) / 100) * ((creditoPct || 0) / 100);
  const creditoCbs = valorContrato * ((cbsPct || 0) / 100) * ((creditoPct || 0) / 100);
  const creditoTotal = creditoIbs + creditoCbs;
  const custoLiquido = valorContrato - creditoTotal;
  return { creditoIbs, creditoCbs, creditoTotal, custoLiquido };
}
// Valor de contratação, sob as condições de crédito do Híbrido, que resulta
// no mesmo custo líquido desejado (usado no cálculo inverso do item CONTRATANTE
// do Ponto de Equilíbrio).
function calcValorContratoParaCustoLiquido({ custoLiquidoDesejado, creditoPct, ibsPct, cbsPct }) {
  const aliqTotal = ((ibsPct || 0) + (cbsPct || 0)) / 100;
  const fator = 1 - aliqTotal * ((creditoPct || 0) / 100);
  if (fator <= 0) return null;
  return custoLiquidoDesejado / fator;
}

const fmtBRL = (v) => (isFinite(v) ? v : 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtPct = (v, dec) => (isFinite(v) ? v : 0).toLocaleString("pt-BR", { minimumFractionDigits: dec == null ? 2 : dec, maximumFractionDigits: dec == null ? 2 : dec }) + "%";
const fmtNum = (v) => (isFinite(v) ? v : 0).toLocaleString("pt-BR");
function parseNum(str) {
  if (typeof str === "number") return str;
  if (!str) return 0;
  const cleaned = String(str).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}
function todayBR() { return new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }); }

function rbt12Atual() {
  return state.empresa.rbt12Modo === "auto" ? state.empresa.faturamentoMensal * 12 : state.empresa.rbt12Manual;
}
function anexoKeyAtual() {
  // O Anexo do Simples Nacional é definido apenas pela escolha do usuário
  // (manual) ou, no modo automático, pela regra do Fator R — nunca inferido
  // a partir do CNAE, que é uma classificação puramente informativa.
  if (state.simples.anexoModo === "manual") return state.simples.anexoManual;
  return "III_V";
}

function validarEntradas() {
  const e = state.empresa, issues = [];
  if (!e.faturamentoMensal || e.faturamentoMensal <= 0) issues.push({ tipo: "red", msg: "Informe um faturamento mensal maior que zero." });
  const rbt12 = rbt12Atual();
  if (rbt12 < e.faturamentoMensal) issues.push({ tipo: "yellow", msg: "O RBT12 informado é menor que o faturamento mensal — verifique se o valor está correto." });
  if (rbt12 > 4800000) issues.push({ tipo: "yellow", msg: "RBT12 acima de R$ 4.800.000,00 — empresa fora do limite de permanência no Simples Nacional." });
  if (e.folha12m > rbt12 && rbt12 > 0) issues.push({ tipo: "yellow", msg: "A folha de salários informada é maior que o RBT12 — confira os valores." });
  return issues;
}

function computeAll() {

  const memoria = [];

  });
  const t = presumido.trimestre;
  memoria.push({
    titulo: "Lucro Presumido — base de cálculo trimestral (" + t.atividade + ")",
    formula: "Base IRPJ = Receita trimestral × " + fmtPct(t.irpjPctUsado) + " = " + fmtBRL(e.faturamentoMensal * 3) + " × " + fmtPct(t.irpjPctUsado) + " = " + fmtBRL(t.baseIRPJ) + "  |  Base CSLL = " + fmtBRL(t.baseCSLL),
    detalhe: "Receita trimestral considerada: faturamento mensal × 3 = " + fmtBRL(e.faturamentoMensal * 3) + " · Ano de projeção: " + t.ano + ".",
  });
  memoria.push({
    titulo: "IRPJ e CSLL — tributos trimestrais",
    formula: "IRPJ normal = " + fmtBRL(t.baseIRPJ) + " × 15% = " + fmtBRL(t.irpjNormal) + "  |  Adicional = máx(" + fmtBRL(t.baseIRPJ) + " − R$ 60.000, 0) × 10% = " + fmtBRL(t.irpjAdicional) + "  |  CSLL = " + fmtBRL(t.baseCSLL) + " × 9% = " + fmtBRL(t.csllTotal),
    detalhe: "IRPJ total do trimestre: " + fmtBRL(t.irpjTotal) + " · Apurados por trimestre (não mensalmente).",
  });
  memoria.push(t.substituidoPorCbs ? {
    titulo: "CBS, IBS e ISS — tributos mensais (ano " + t.ano + ")",
    formula: "CBS = Receita × " + fmtPct(t.crono.cbs, 2) + " = " + fmtBRL(t.cbs) + "  |  IBS = Receita × " + fmtPct(t.crono.ibs, 2) + " = " + fmtBRL(t.ibs) + "  |  ISS = Receita × " + fmtPct(t.issAliqEfetivaPct) + " = " + fmtBRL(t.iss),
    detalhe: "A partir de 2027, a LC 214/2025 extingue PIS e COFINS, substituídos pela CBS; o ISS informado (" + fmtPct(state.presumido.issAliq) + ") é aplicado " + (t.fatorRemanescenteIss < 1 ? "a " + fmtPct(t.fatorRemanescenteIss * 100, 0) + " de sua alíquota, conforme o cronograma de redução do ISS/ICMS" : "integralmente") + " — mesmo cronograma de transição (IBS_CBS_CRONOGRAMA) usado na aba Simples Híbrido. Total do trimestre: " + fmtBRL(t.totalTrimestre) + " · Carga efetiva: " + fmtPct(t.cargaEfetivaPct) + ".",
  } : {
    titulo: "PIS, COFINS e ISS — tributos mensais (ano " + t.ano + ")",
    formula: "PIS = " + fmtBRL(t.pis) + "  |  COFINS = " + fmtBRL(t.cofins) + "  |  ISS = " + fmtBRL(t.iss),
    detalhe: "Ano-teste da reforma (2026) ou anterior: PIS/COFINS/ISS permanecem pelas regras vigentes — o valor-teste de CBS/IBS é integralmente compensável, sem impacto financeiro líquido. Total do trimestre: " + fmtBRL(t.totalTrimestre) + " · Carga efetiva: " + fmtPct(t.cargaEfetivaPct) + ".",

  // ---- Simples Híbrido — composição separada de DAS / IBS / CBS / créditos ----
  const cronoAno = IBS_CBS_CRONOGRAMA.find((c) => c.ano === state.hibrido.anoProjecao) || IBS_CBS_CRONOGRAMA[IBS_CBS_CRONOGRAMA.length - 1];
  const hibrido = calcSimplesHibrido({
    faturamentoMensal: e.faturamentoMensal,
    dasMensal: simples.dasMensal,
    partilha: simples.partilha,
    partilhaValores: simples.partilhaValores,
    cronoAno,
    creditoIbsPct: state.hibrido.creditoIbsPct,
    creditoCbsPct: state.hibrido.creditoCbsPct,
  });
  memoria.push({
    titulo: "Simples Híbrido — DAS sem IBS/CBS (ano " + hibrido.ano + ")",
    formula: "DAS sem IBS/CBS = DAS total − parcela de " + (hibrido.tributoConsumo || "ICMS/ISS") + " (" + fmtBRL(hibrido.parcelaIbsNoDas) + ") − parcela de PIS/COFINS (" + fmtBRL(hibrido.parcelaCbsNoDas) + ") = " + fmtBRL(simples.dasMensal) + " − " + fmtBRL(hibrido.parcelaConsumoDas) + " = " + fmtBRL(hibrido.dasSemIbsCbs),
    detalhe: "No mecanismo de apuração à parte (previsto a partir de 2027), as parcelas do DAS hoje correspondentes a " + (hibrido.tributoConsumo || "ICMS/ISS") + " (vira IBS) e a PIS/COFINS (vira CBS) saem da partilha do Simples e passam a ser recolhidas separadamente, em regime não cumulativo. IRPJ, CSLL e CPP permanecem no DAS.",
  });
  memoria.push({
    titulo: "IBS e CBS — débito e crédito",
    formula: "IBS débito = Faturamento × " + fmtPct(hibrido.ibsPct, 2) + " = " + fmtBRL(hibrido.ibsDebito) + "  |  CBS débito = Faturamento × " + fmtPct(hibrido.cbsPct, 2) + " = " + fmtBRL(hibrido.cbsDebito),
    detalhe: "Crédito IBS informado: " + fmtPct(hibrido.creditoIbsPct, 1) + " do débito (" + fmtBRL(hibrido.creditoIbs) + ") · Crédito CBS informado: " + fmtPct(hibrido.creditoCbsPct, 1) + " do débito (" + fmtBRL(hibrido.creditoCbs) + "). Estes percentuais são PARÂMETROS DE SIMULAÇÃO, ajustáveis pelo usuário conforme os créditos de insumos efetivamente apurados pela empresa — não são alíquota legal e não é assumido crédito integral por padrão. O crédito de IBS não é compensado contra o débito de CBS (créditos apurados separadamente).",
  });
  memoria.push({
    titulo: "Total Híbrido líquido",
    formula: "IBS líquido = " + fmtBRL(hibrido.ibsDebito) + " − " + fmtBRL(hibrido.creditoIbs) + " = " + fmtBRL(hibrido.ibsLiquido) + "  |  CBS líquido = " + fmtBRL(hibrido.cbsDebito) + " − " + fmtBRL(hibrido.creditoCbs) + " = " + fmtBRL(hibrido.cbsLiquido) + "  |  Total Híbrido = " + fmtBRL(hibrido.dasSemIbsCbs) + " + " + fmtBRL(hibrido.ibsLiquido) + " + " + fmtBRL(hibrido.cbsLiquido) + " = " + fmtBRL(hibrido.totalMensal),
    detalhe: "Carga efetiva do Híbrido: " + fmtPct(hibrido.cargaEfetivaPct) + " (Simples Normal: " + fmtPct(simples.cargaEfetivaPct) + ") · Total anual: " + fmtBRL(hibrido.totalAnual) + ".",
  });

  const pe = calcPontoEquilibrio({
    custosFixosMensais: state.equilibrio.custosFixos,
    custosVariaveisPct: state.equilibrio.custosVariaveisPct,
    cargaTributariaPct: simples.cargaEfetivaPct,
  });

  // ---- Ponto de equilíbrio — PRESTADORA: receita necessária no Híbrido para
  // manter o mesmo resultado líquido mensal de hoje (Simples Normal). ----
  const custosVarAtual = e.faturamentoMensal * (state.equilibrio.custosVariaveisPct / 100);
  const resultadoAtualPrestadora = e.faturamentoMensal - custosVarAtual - state.equilibrio.custosFixos - simples.dasMensal;
  const receitaHibridoParaMesmoResultado = calcReceitaParaResultado({
    resultadoDesejadoMensal: resultadoAtualPrestadora,
    custosFixosMensais: state.equilibrio.custosFixos,
    custosVariaveisPct: state.equilibrio.custosVariaveisPct,
    cargaTributariaPct: hibrido.cargaEfetivaPct,
  });
  const pePrestadora = {
    valorAtualContrato: e.faturamentoMensal,
    resultadoAtual: resultadoAtualPrestadora,
    valido: receitaHibridoParaMesmoResultado.valido,
    receitaNecessariaHibrido: receitaHibridoParaMesmoResultado.valido ? receitaHibridoParaMesmoResultado.receita : null,
  };

  // ---- Ponto de equilíbrio — CONTRATANTE: custo líquido hoje x valor de
  // contrato equivalente no Híbrido para manter o mesmo custo líquido. ----
  const contratoAtualEquilibrio = state.equilibrio.contratoBruto;
  const creditoContratanteAtualPct = state.equilibrio.creditoContratanteAtualPct || 0;
  const creditoContratanteAtual = contratoAtualEquilibrio * (creditoContratanteAtualPct / 100);
  const custoLiquidoContratanteAtual = contratoAtualEquilibrio - creditoContratanteAtual;
  const peContratante = {
    valorAtualContrato: contratoAtualEquilibrio,
    creditoAtualPct: creditoContratanteAtualPct,
    creditoAtual: creditoContratanteAtual,
    custoLiquidoAtual: custoLiquidoContratanteAtual,
    valorEquivalenteHibrido: calcValorContratoParaCustoLiquido({
      custoLiquidoDesejado: custoLiquidoContratanteAtual,
      creditoPct: state.hibrido.creditoContratanteHibridoPct,
      ibsPct: hibrido.ibsPct, cbsPct: hibrido.cbsPct,
    }),
  };

  state.result = { rbt12, anexoKey, simples, presumido, hibrido, pe, pePrestadora, peContratante, issues: validarEntradas(), timestamp: new Date() };
  state.memoria = memoria;
  return state.result;
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach((k) => {
    if (k === "class") node.className = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children || []).forEach((c) => { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}
function badge(text, kind, iconName) {
  return '<span class="badge badge-' + kind + '">' + (iconName ? icon(iconName) : "") + text + "</span>";
}
function alertBox(kind, iconName, html) {
  return '<div class="alert alert-' + kind + '">' + icon(iconName) + '<div>' + html + '</div></div>';
}

function confirm2(msg) { try { return window.confirm(msg); } catch (err) { return true; } }
function fmtInput(v) { return (v || 0).toString().replace(".", ","); }
function escAttr(s) { return (s || "").replace(/"/g, "&quot;"); }

function cnaeHintHTML(cnae) {
  if (!cnae) return "Não selecionado. O CNAE é uma classificação oficial (CONCLA/IBGE) e não define automaticamente o Anexo do Simples Nacional — o enquadramento tributário é feito na aba Simples Nacional.";
  const h = cnaeHierarquia(cnae);
  const parts = [];
  if (cnae.secao) parts.push("Seção " + cnae.secao + (h && h.secao ? " — " + h.secao.descricao : ""));
  if (cnae.divisao) parts.push("Divisão " + cnae.divisao);
  if (cnae.grupo) parts.push("Grupo " + cnae.grupo);
  if (cnae.classe) parts.push("Classe " + cnae.classe);
  return (parts.length ? parts.join(" · ") + ". " : "") + "Classificação oficial — não define automaticamente o Anexo do Simples Nacional.";
}
function cnaeStatusBadgeHTML() {
  if (CNAE_STATUS.estado === "ok") return badge("Base carregada — " + CNAE_STATUS.registros + " CNAEs (atualizado em " + fmtDateBR(CNAE_STATUS.atualizadoEm) + ")", "green", "check");
  if (CNAE_STATUS.estado === "erro") return badge("Base indisponível — " + CNAE_STATUS.mensagem, "yellow", "alert");
  return badge("Carregando base de CNAEs...", "blue", "info");
}

function setupCnaeAutocomplete() {
  const input = $("#fCnae"), list = $("#acList");
  if (input) {
    function renderList(items, query) {
      if (CNAE_STATUS.estado === "erro") {
        list.innerHTML = '<div class="ac-item ac-empty">Base de CNAEs indisponível no momento. Use "Importar base oficial" para carregar um arquivo JSON/CSV.</div>';
        list.hidden = false;
        return;
      }
      if (CNAE_STATUS.estado !== "ok" || !CNAE_DATA) {
        list.innerHTML = '<div class="ac-item ac-empty">Carregando base de CNAEs...</div>';
        list.hidden = false;
        return;
      }
      if (!items.length) {
        list.innerHTML = '<div class="ac-item ac-empty">Nenhum CNAE encontrado para "' + escHtml(query) + '". Confira o código/descrição ou tente outra palavra-chave.</div>';
        list.hidden = false;
        return;
      }
      list.innerHTML = items.map((x) =>
        '<div class="ac-item" data-c="' + escAttr(x.codigo) + '"><span class="code">' + escHtml(x.codigo) + '</span>' + (x.secao ? '<span class="tag">Seção ' + escHtml(x.secao) + '</span>' : "") + '<div class="desc">' + escHtml(x.descricao) + '</div></div>'
      ).join("");
      list.hidden = false;
      $$(".ac-item[data-c]", list).forEach((it) => it.onclick = () => {
        const found = CNAE_DATA.subclasses.find((c) => c.codigo === it.dataset.c);
        if (found) state.empresa.cnae = found;
        list.hidden = true;
        renderContent();
      });
    }
    input.addEventListener("input", () => {
      const q = input.value.trim();
      if (!q) { list.hidden = true; return; }
      renderList(cnaeSearch(q, 12), q);
    });
    input.addEventListener("focus", () => { if (input.value.trim()) input.dispatchEvent(new Event("input")); });
    document.addEventListener("click", (ev) => { if (!ev.target.closest(".autocomplete")) list.hidden = true; }, { once: false });
  }
  const importBtn = $("#btnImportCnae"), importInput = $("#fCnaeImport");
  if (importBtn && importInput) {
    importBtn.onclick = () => importInput.click();
    importInput.onchange = (ev) => { const f = ev.target.files && ev.target.files[0]; if (f) importCnaeFile(f); };
  }
}

/* ---------------------------------------------------------------------------
   RENDER: FATOR R
   --------------------------------------------------------------------------- */
function renderFatorR(root) {
  const e = state.empresa;
  const rbt12 = rbt12Atual();
  const fatorR = calcFatorR(e.folha12m, rbt12);
  const simIII = calcSimplesNacional({ faturamentoMensal: e.faturamentoMensal, rbt12, anexoKey: "III" });
  const simV = calcSimplesNacional({ faturamentoMensal: e.faturamentoMensal, rbt12, anexoKey: "V" });
  const enquadrado = fatorR >= 0.28 ? "III" : "V";

  root.appendChild(el("div", { class: "section-head", html: '<div><h2>Fator R</h2><p class="sub">Compara o enquadramento em Anexo III e Anexo V conforme a folha de pagamento</p></div>' }));

  const inputCard = el("div", { class: "card" });
  inputCard.innerHTML = '<div class="card-title">' + icon("percent") + 'Parâmetros</div>' +
    '<div class="grid grid-3">' +
    '<div class="field"><label for="frFat">Faturamento mensal</label><input type="text" inputmode="decimal" id="frFat" value="' + fmtInput(e.faturamentoMensal) + '"></div>' +
    '<div class="field"><label for="frRbt">RBT12</label><input type="text" inputmode="decimal" id="frRbt" value="' + fmtInput(rbt12) + '"></div>' +
    '<div class="field"><label for="frFolha">Folha de salários (12m, com pró-labore)</label><input type="text" inputmode="decimal" id="frFolha" value="' + fmtInput(e.folha12m) + '"></div>' +
    '</div>';
  root.appendChild(inputCard);

  root.appendChild(el("div", { html:
    alertBox("blue", "info", "<b>Fator R = " + fmtPct(fatorR * 100) + "</b> · Folha (12m) ÷ RBT12 = " + fmtBRL(e.folha12m) + " ÷ " + fmtBRL(rbt12) + ". " + (fatorR >= 0.28 ? "Igual ou acima de 28% → enquadramento no Anexo III." : "Abaixo de 28% → enquadramento no Anexo V.")) }));

  const cmp = el("div", { class: "grid grid-2" });
  cmp.innerHTML =
    fatorRRegimeCard("Anexo III", simIII, enquadrado === "III") +
    fatorRRegimeCard("Anexo V", simV, enquadrado === "V");
  root.appendChild(cmp);

  const diffCard = el("div", { class: "card" });
  const diffMensal = simV.dasMensal - simIII.dasMensal;
  diffCard.innerHTML = '<div class="card-title">' + icon("scale") + 'Diferença de custo tributário</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Comparação</th><th class="num">Anexo III</th><th class="num">Anexo V</th><th class="num">Diferença</th></tr></thead><tbody>' +
    '<tr><td>Alíquota efetiva</td><td class="num">' + fmtPct(simIII.cargaEfetivaPct) + '</td><td class="num">' + fmtPct(simV.cargaEfetivaPct) + '</td><td class="num">' + fmtPct(simV.cargaEfetivaPct - simIII.cargaEfetivaPct) + '</td></tr>' +
    '<tr class="total"><td>DAS mensal</td><td class="num">' + fmtBRL(simIII.dasMensal) + '</td><td class="num">' + fmtBRL(simV.dasMensal) + '</td><td class="num">' + fmtBRL(diffMensal) + '</td></tr>' +
    '</tbody></table></div>' +
    '<p class="tiny muted" style="margin-top:10px">O enquadramento correto depende do Fator R apurado mês a mês — este comparativo é referencial para planejamento.</p>';
  root.appendChild(diffCard);

  setTimeout(() => {
    $("#frFat").onchange = (ev) => { state.empresa.faturamentoMensal = parseNum(ev.target.value); if (state.empresa.rbt12Modo === "auto") {} renderContent(); };
    $("#frRbt").onchange = (ev) => { state.empresa.rbt12Modo = "manual"; state.empresa.rbt12Manual = parseNum(ev.target.value); renderContent(); };
    $("#frFolha").onchange = (ev) => { state.empresa.folha12m = parseNum(ev.target.value); renderContent(); };
  }, 0);
}
function fatorRRegimeCard(nome, sim, ativo) {
  return '<div class="regime-card' + (ativo ? " selected" : "") + '">' +
    '<div class="rh"><h3>' + nome + '</h3>' + (ativo ? badge("Enquadramento atual", "green", "check") : badge("Alternativo", "blue")) + '</div>' +
    '<div><div class="kpi-label">Custo tributário estimado / mês</div><div class="val">' + fmtBRL(sim.dasMensal) + '</div></div>' +

    '<div class="row"><span>Total anual</span><b>' + fmtBRL(sim.dasAnual) + '</b></div>' +
    '<div class="row"><span>Faixa</span><b>' + sim.faixaLabel + '</b></div></div>';
}

    $("#hibValor").onchange = (ev) => { state.hibrido.valorContratoAnual = parseNum(ev.target.value); renderContent(); };

    const acc = $("#hibComposicaoAcc");

    '<tr class="total"><td>Total de tributos trimestrais</td><td class="num">' + fmtBRL(t.irpjTotal + t.csllTotal) + '</td></tr>' +

    '<div style="height:14px"></div>' +
    '<div class="table-wrap"><table><thead><tr><th colspan="2">Tributos mensais (valores do trimestre)</th></tr></thead><tbody>' +
    (t.substituidoPorCbs
      ? '<tr><td>CBS (' + fmtPct(t.crono.cbs, 2) + ') <span class="tiny muted">— substitui PIS/COFINS</span></td><td class="num">' + fmtBRL(t.cbs) + '</td></tr>' +
        '<tr><td>IBS (' + fmtPct(t.crono.ibs, 2) + ')</td><td class="num">' + fmtBRL(t.ibs) + '</td></tr>'
      : '<tr><td>PIS (' + fmtPct(state.presumido.pisAliq) + ')</td><td class="num">' + fmtBRL(t.pis) + '</td></tr>' +
        '<tr><td>COFINS (' + fmtPct(state.presumido.cofinsAliq) + ')</td><td class="num">' + fmtBRL(t.cofins) + '</td></tr>') +
    '<tr><td>ISS (' + fmtPct(t.issAliqEfetivaPct) + (t.fatorRemanescenteIss < 1 ? ' — ' + fmtPct(t.fatorRemanescenteIss * 100, 0) + ' da alíquota informada' : '') + ')</td><td class="num">' + fmtBRL(t.iss) + '</td></tr>' +
    '<tr class="total"><td>Total de tributos mensais (no trimestre)</td><td class="num">' + fmtBRL(t.consumoTotal) + '</td></tr>' +
    '</tbody></table></div>' +
    '<div style="height:14px"></div>' +
    '<div class="table-wrap"><table><tbody>' +
    '<tr class="total"><td>Total do trimestre (trimestrais + mensais)</td><td class="num">' + fmtBRL(t.totalTrimestre) + '</td></tr>' +
    '<tr class="total"><td>Total mensal equivalente</td><td class="num">' + fmtBRL(t.totalTrimestre / 3) + '</td></tr>' +
    '<tr class="total"><td>Total anual</td><td class="num">' + fmtBRL(r.presumido.totalAnual) + '</td></tr>' +
    '</tbody></table></div>';
  root.appendChild(tableCard);

  setTimeout(() => {
    $("#lpAtiv").onchange = (ev) => { state.presumido.atividade = ev.target.value; renderContent(); };
    $("#lpReceita").onchange = (ev) => {
      const v = parseNum(ev.target.value);
      state.empresa.faturamentoMensal = v / 3;
      if (state.empresa.rbt12Modo === "auto") {}
      renderContent();
    };
    $("#lpAno").onchange = (ev) => { state.presumido.anoProjecao = parseInt(ev.target.value, 10); renderContent(); };
    if ($("#lpPis")) $("#lpPis").onchange = (ev) => { state.presumido.pisAliq = parseNum(ev.target.value); renderContent(); };
    if ($("#lpCofins")) $("#lpCofins").onchange = (ev) => { state.presumido.cofinsAliq = parseNum(ev.target.value); renderContent(); };
    $("#lpIss").onchange = (ev) => { state.presumido.issAliq = parseNum(ev.target.value); renderContent(); };
    $("#lpMaj").onchange = (ev) => { state.presumido.majoracao = ev.target.checked; renderContent(); };
  }, 0);
}

/* ---------------------------------------------------------------------------
   RENDER: COMPARATIVO
   --------------------------------------------------------------------------- */
function cmpCell(value, note, isPct) {
  if (value == null) return note ? '<span class="tiny muted">' + note + '</span>' : '<span class="muted">—</span>';
  const s = isPct ? fmtPct(value) : fmtBRL(value);
  return s + (note ? ' <span class="tiny muted">(' + note + ')</span>' : "");
}
function cmpRow(label, cells, strong) {
  return '<tr' + (strong ? ' class="total"' : '') + '><td>' + label + '</td>' +
    cells.map((c) => '<td class="num">' + cmpCell(c.v, c.note, c.pct) + '</td>').join("") + '</tr>';
}
function renderComparativo(root) {
  const r = computeAll();
  const h = r.hibrido;
  const pv = r.simples.partilhaValores;
  const t = r.presumido.trimestre;
  const NO_DAS = "no DAS";
  const view = state.comparativo.view;

  root.appendChild(el("div", { class: "section-head", html:
    '<div><h2>Comparativo</h2><p class="sub">Simples Normal × Simples Híbrido × Lucro Presumido</p></div>' +
    '<div class="radio-pills" id="cmpViewPills">' +
      '<button type="button" class="radio-pill' + (view === "resumo" ? " active" : "") + '" data-cmpview="resumo">Resumo Executivo</button>' +
      '<button type="button" class="radio-pill' + (view === "detalhado" ? " active" : "") + '" data-cmpview="detalhado">Detalhado</button>' +
    '</div>' }));

  if (view === "resumo") {
    const cards = el("div", { class: "grid grid-3" });
    cards.innerHTML =
      resumoExecCard("Simples Normal", r.simples.dasMensal, r.simples.cargaEfetivaPct, false) +
      resumoExecCard("Simples Híbrido", h.totalMensal, h.cargaEfetivaPct, true) +
      resumoExecCard("Lucro Presumido", t.totalTrimestre / 3, r.presumido.cargaEfetivaPct, false);
    root.appendChild(cards);

    const chartCard = el("div", { class: "card" });
    chartCard.innerHTML = '<div class="card-title">' + icon("chart") + 'Custo mensal — três cenários</div><div class="chart-box"><canvas id="chartComparativo"></canvas></div>';
    root.appendChild(chartCard);

    root.appendChild(el("div", { html: alertBox("blue", "info", "Visão simplificada para apresentação ao cliente — mostra apenas custo mensal e carga efetiva. O detalhamento tributário completo está disponível na opção \"Detalhado\".") }));
  } else {
    const tableCard = el("div", { class: "card" });
    tableCard.innerHTML = '<div class="card-title">' + icon("chart") + 'Comparação detalhada (valores mensais, salvo indicado)</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Simples Normal</th><th class="num">Simples Híbrido</th><th class="num">Presumido</th></tr></thead><tbody>' +
      cmpRow("DAS", [{ v: r.simples.dasMensal }, { v: h.dasSemIbsCbs, note: "sem IBS/CBS" }, { v: null }]) +
      cmpRow("IRPJ", [{ v: pv.IRPJ || 0, note: NO_DAS }, { v: pv.IRPJ || 0, note: NO_DAS }, { v: t.irpjTotal / 3 }]) +
      cmpRow("CSLL", [{ v: pv.CSLL || 0, note: NO_DAS }, { v: pv.CSLL || 0, note: NO_DAS }, { v: t.csllTotal / 3 }]) +
      cmpRow("ISS", [{ v: pv.ISS != null ? pv.ISS : null, note: pv.ISS != null ? NO_DAS : null }, { v: null }, { v: t.iss / 3 }]) +
      cmpRow("PIS + COFINS", [{ v: null }, { v: null }, { v: t.substituidoPorCbs ? null : (t.pis + t.cofins) / 3, note: t.substituidoPorCbs ? "extinto — substituído pela CBS a partir de 2027" : null }]) +
      cmpRow("IBS", [{ v: (pv.ICMS || 0) + (pv.ISS || 0), note: NO_DAS }, { v: h.ibsDebito }, { v: t.substituidoPorCbs ? t.ibs / 3 : null, note: t.substituidoPorCbs ? null : "não aplicável antes de 2027" }]) +
      cmpRow("CBS", [{ v: (pv.COFINS || 0) + (pv.PIS || 0), note: NO_DAS }, { v: h.cbsDebito }, { v: t.substituidoPorCbs ? t.cbs / 3 : null, note: t.substituidoPorCbs ? null : "não aplicável antes de 2027" }]) +
      cmpRow("Crédito IBS", [{ v: null }, { v: -h.creditoIbs }, { v: null }]) +
      cmpRow("Crédito CBS", [{ v: null }, { v: -h.creditoCbs }, { v: null }]) +
      cmpRow("Total mensal", [{ v: r.simples.dasMensal }, { v: h.totalMensal }, { v: t.totalTrimestre / 3 }], true) +
      cmpRow("Total anual", [{ v: r.simples.dasAnual }, { v: h.totalAnual }, { v: r.presumido.totalAnual }], true) +
      cmpRow("Carga efetiva", [{ v: r.simples.cargaEfetivaPct, pct: true }, { v: h.cargaEfetivaPct, pct: true }, { v: r.presumido.cargaEfetivaPct, pct: true }], true) +
      '</tbody></table></div>' +
      '<p class="tiny muted" style="margin-top:10px">"(' + NO_DAS + ')" indica que o valor já está embutido no DAS do Simples — não é um pagamento adicional. No Híbrido, IRPJ/CSLL permanecem no DAS; IBS e CBS são apurados à parte, com créditos conforme parâmetros informados na aba Simples Híbrido (ano de referência: ' + h.ano + '). O Lucro Presumido não possui DAS; a partir de 2027 (ano de projeção selecionado na aba Lucro Presumido: ' + t.ano + '), PIS e COFINS são substituídos pela CBS e o IBS passa a incidir, pelo mesmo cronograma de transição usado no Simples Híbrido — antes de 2027, mantém PIS/COFINS/ISS pelas regras vigentes.</p>';
    root.appendChild(tableCard);

    const chartsGrid = el("div", { class: "grid grid-2" });
    chartsGrid.innerHTML =
      '<div class="card"><div class="card-title">' + icon("chart") + 'Custo mensal — três cenários</div><div class="chart-box"><canvas id="chartComparativo"></canvas></div></div>' +
      '<div class="card"><div class="card-title">' + icon("layers") + 'Composição do Híbrido</div><div class="chart-box"><canvas id="chartHibridoComposicao"></canvas></div></div>';
    root.appendChild(chartsGrid);

    root.appendChild(el("div", { html: alertBox("blue", "info", "Este resultado considera as premissas informadas nas abas Dados da Empresa, Fator R, Lucro Presumido e Simples Híbrido.") }));
  }

  setTimeout(() => {
    $$('[data-cmpview]').forEach((b) => b.onclick = () => { state.comparativo.view = b.dataset.cmpview; renderContent(); });
  }, 0);
}

/* ---------------------------------------------------------------------------
   RENDER: PONTO DE EQUILÍBRIO
   --------------------------------------------------------------------------- */
function renderEquilibrio(root) {
  const r = computeAll();
  const pe = calcPontoEquilibrio({ custosFixosMensais: state.equilibrio.custosFixos, custosVariaveisPct: state.equilibrio.custosVariaveisPct, cargaTributariaPct: r.simples.cargaEfetivaPct });

  root.appendChild(el("div", { class: "section-head", html: '<div><h2>Ponto de Equilíbrio</h2><p class="sub">Receita mínima mensal e cálculo inverso de contrato</p></div>' }));

  const peCard = el("div", { class: "card" });
  peCard.innerHTML = '<div class="card-title">' + icon("scale") + 'Ponto de equilíbrio mensal</div>' +
    '<div class="grid grid-3">' +
    '<div class="field"><label for="peFixos">Custos fixos mensais</label><input type="text" inputmode="decimal" id="peFixos" value="' + fmtInput(state.equilibrio.custosFixos) + '"></div>' +
    '<div class="field"><label for="peVar">Custos variáveis (% da receita)</label><input type="text" inputmode="decimal" id="peVar" value="' + fmtInput(state.equilibrio.custosVariaveisPct) + '"></div>' +
    '<div class="field"><label>Carga tributária efetiva</label><input type="text" value="' + fmtPct(r.simples.cargaEfetivaPct) + '" disabled></div>' +
    '</div>';
  root.appendChild(peCard);

  if (!pe.valido) {
    root.appendChild(el("div", { html: alertBox("red", "alert", "Custos variáveis + carga tributária somam 100% ou mais da receita — não há ponto de equilíbrio possível com os parâmetros informados.") }));
  } else {
    const kpis = el("div", { class: "grid grid-3" });
    kpis.innerHTML =
      kpiCard("scale", "Receita de equilíbrio", fmtBRL(pe.receitaEquilibrio), "Por mês", false, true) +
      kpiCard("percent", "Margem de contribuição", fmtPct(pe.margemContribuicaoPct), "Após custos variáveis e tributos", false) +
      kpiCard("trending", "Distância do faturamento atual", fmtBRL(state.empresa.faturamentoMensal - pe.receitaEquilibrio), state.empresa.faturamentoMensal >= pe.receitaEquilibrio ? "Acima do equilíbrio" : "Abaixo do equilíbrio", false);
    root.appendChild(kpis);
  }

  const invCard = el("div", { class: "card" });
  invCard.innerHTML = '<div class="card-title">' + icon("swap") + 'Cálculo inverso de contrato (bruto × líquido)</div>' +
    '<p class="small muted" style="margin-bottom:14px">Converte valores brutos e líquidos usando a carga tributária efetiva do Simples Normal (' + fmtPct(r.simples.cargaEfetivaPct) + ').</p>' +
    '<div class="grid grid-2">' +
    '<div class="field"><label for="invBruto">Valor bruto do contrato</label><input type="text" inputmode="decimal" id="invBruto" value="' + fmtInput(state.equilibrio.contratoBruto) + '"><span class="hint">Líquido resultante: <b class="num">' + fmtBRL(calcBrutoParaLiquido(state.equilibrio.contratoBruto, r.simples.cargaEfetivaPct)) + '</b></span></div>' +
    '<div class="field"><label for="invLiquido">Valor líquido desejado</label><input type="text" inputmode="decimal" id="invLiquido" value="' + fmtInput(state.equilibrio.contratoLiquido) + '"><span class="hint">Bruto necessário: <b class="num">' + fmtBRL(calcLiquidoParaBruto(state.equilibrio.contratoLiquido, r.simples.cargaEfetivaPct) || 0) + '</b></span></div>' +
    '</div>';
  root.appendChild(invCard);

  // ---- PRESTADORA × CONTRATANTE — Simples Normal x Híbrido (item 8) ----
  // Dois cálculos distintos e não misturados: a PRESTADORA olha para o
  // próprio resultado (faturamento − custos − tributos); o CONTRATANTE olha
  // para o custo líquido de contratar essa empresa, dado o crédito de
  // IBS/CBS que consegue aproveitar.
  root.appendChild(el("div", { class: "section-head", html: '<div><h3 style="font-size:17px">Simples Normal × Simples Híbrido no Ponto de Equilíbrio</h3><p class="sub">Dois cálculos separados — não misturar os conceitos de prestadora e contratante</p></div>' }));

  const pp = r.pePrestadora;
  const prestCard = el("div", { class: "card" });
  prestCard.innerHTML = '<div class="card-title">' + icon("building") + 'PRESTADORA — manter o mesmo resultado no Híbrido</div>' +
    '<div class="table-wrap"><table><tbody>' +
    '<tr><td>Valor atual do contrato (faturamento mensal)</td><td class="num">' + fmtBRL(pp.valorAtualContrato) + '</td></tr>' +
    '<tr><td>Resultado atual (após custos fixos, variáveis e DAS do Simples Normal)</td><td class="num">' + fmtBRL(pp.resultadoAtual) + '</td></tr>' +
    (pp.valido
      ? '<tr class="total"><td>Valor necessário no Híbrido para manter o mesmo resultado</td><td class="num">' + fmtBRL(pp.receitaNecessariaHibrido) + '</td></tr>' +
        '<tr><td>Diferença em relação ao faturamento atual</td><td class="num">' + fmtBRL(pp.receitaNecessariaHibrido - pp.valorAtualContrato) + '</td></tr>'
      : '<tr><td colspan="2" class="muted">Custos variáveis + carga tributária do Híbrido somam 100% ou mais da receita — não há valor de equilíbrio possível com os parâmetros informados.</td></tr>') +
    '</tbody></table></div>' +
    '<p class="tiny muted" style="margin-top:10px">Usa os custos fixos/variáveis informados acima e a carga efetiva do Híbrido calculada na aba Simples Híbrido (ano ' + r.hibrido.ano + ', ' + fmtPct(r.hibrido.cargaEfetivaPct) + ').</p>';
  root.appendChild(prestCard);

  const pc = r.peContratante;
  const contCard = el("div", { class: "card" });
  contCard.innerHTML = '<div class="card-title">' + icon("briefcase") + 'CONTRATANTE — custo líquido hoje × equivalente no Híbrido</div>' +
    '<div class="field" style="max-width:360px;margin-bottom:14px"><label for="peCredAtual">Crédito aproveitável hoje sobre o contrato (%)</label><input type="text" inputmode="decimal" id="peCredAtual" value="' + fmtInput(state.equilibrio.creditoContratanteAtualPct) + '"><span class="hint">Parâmetro de simulação — no Simples Normal, o crédito ao tomador é limitado/embutido na partilha do DAS; ajuste conforme a regra aplicável ao caso.</span></div>' +
    '<div class="table-wrap"><table><tbody>' +
    '<tr><td>Valor atual do contrato</td><td class="num">' + fmtBRL(pc.valorAtualContrato) + '</td></tr>' +
    '<tr><td>Crédito atual (' + fmtPct(pc.creditoAtualPct, 1) + ')</td><td class="num">' + fmtBRL(pc.creditoAtual) + '</td></tr>' +
    '<tr class="total"><td>Custo líquido atual</td><td class="num">' + fmtBRL(pc.custoLiquidoAtual) + '</td></tr>' +
    '<tr><td>Valor de contrato equivalente no Híbrido (mesmo custo líquido)</td><td class="num">' + (pc.valorEquivalenteHibrido != null ? fmtBRL(pc.valorEquivalenteHibrido) : '<span class="muted">—</span>') + '</td></tr>' +
    '</tbody></table></div>' +
    '<div style="height:10px"></div>' +
    alertBox("yellow", "alert", "Não é assumido crédito integral automaticamente. O crédito efetivo de IBS/CBS no Híbrido usa o percentual informado na aba Simples Híbrido (" + fmtPct(state.hibrido.creditoContratanteHibridoPct, 1) + ") e depende das condições legais aplicáveis a cada operação.");
  root.appendChild(contCard);

  setTimeout(() => {
    $("#peFixos").onchange = (ev) => { state.equilibrio.custosFixos = parseNum(ev.target.value); renderContent(); };
    $("#peVar").onchange = (ev) => { state.equilibrio.custosVariaveisPct = parseNum(ev.target.value); renderContent(); };
    $("#invBruto").onchange = (ev) => { state.equilibrio.contratoBruto = parseNum(ev.target.value); renderContent(); };
    $("#invLiquido").onchange = (ev) => { state.equilibrio.contratoLiquido = parseNum(ev.target.value); renderContent(); };
    $("#peCredAtual").onchange = (ev) => { state.equilibrio.creditoContratanteAtualPct = parseNum(ev.target.value); renderContent(); };
  }, 0);
}

/* ---------------------------------------------------------------------------
   RENDER: MEMÓRIA DE CÁLCULO
   --------------------------------------------------------------------------- */
function renderMemoria(root) {
  computeAll();
  root.appendChild(el("div", { class: "section-head", html: '<div><h2>Memória de Cálculo</h2><p class="sub">Passo a passo de todas as fórmulas aplicadas na simulação atual</p></div>' }));
  const wrap = el("div");
  state.memoria.forEach((step, i) => {
    const acc = el("div", { class: "accordion" + (i === 0 ? " open" : "") });
    acc.innerHTML =
      '<div class="acc-head"><span class="step-badge">' + (i + 1) + '</span><strong>' + step.titulo + '</strong>' + icon("chevron", "chev") + '</div>' +
      '<div class="acc-body"><div class="acc-body-inner"><div class="formula">' + step.formula + '</div><p class="small muted">' + step.detalhe + '</p></div></div>';
    acc.querySelector(".acc-head").onclick = () => {
      const open = acc.classList.contains("open");
      acc.classList.toggle("open");
      const body = acc.querySelector(".acc-body");
      body.style.maxHeight = open ? "0px" : body.scrollHeight + "px";
    };
    wrap.appendChild(acc);
  });
  root.appendChild(wrap);
  setTimeout(() => $$(".accordion.open .acc-body").forEach((b) => (b.style.maxHeight = b.scrollHeight + "px")), 0);
}
